# CodeRabbit configuration — runs alongside PR-Agent for comparison.
# Docs: https://docs.coderabbit.ai
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_instructions:
    - path: "internal/ai/**"
      instructions: |
        This is the LLM provider layer. Key patterns:
        - cliBackend interface: Reflect + Classify methods
        - All CLI clients follow same shape: struct with binary field, run helper with timeout + env stripping
        - stripLLMKeys strips provider API keys from subprocess env
        - SourceProvider maps host source strings to CLI backends
    - path: "internal/mcpinit/**"
      instructions: |
        This is the MCP init / hook layer. Key patterns:
        - Stop hook spawns reflect/resolve/supersede as detached processes
        - --source flag forwarding from host to spawned processes
        - Host event parsing with contract envelope
    - path: "cmd/ghost/**"
      instructions: |
        CLI entrypoint. Key patterns:
        - buildClassifyProvider / buildClassifyProviderForSource
        - runReflect / runResolve / runSupersede subcommands
        - --source flag for source-aware LLM routing
chat:
  auto_reply: false
keywords:
  - "ghost"
  - "mcp"
  - "sqlite"
  - "memory"
  - "llm"
