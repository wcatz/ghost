# Ghost — MCP Memory Server Configuration
# Platform user config path (for example, ~/.config/ghost/config.yaml on
# Linux; ~/Library/Application Support/ghost/config.yaml on macOS when
# XDG_CONFIG_HOME is unset; %AppData%\ghost\config.yaml on Windows).
#
# Loading order (later overrides earlier):
#   1. Compiled defaults
#   2. /etc/ghost/config.yaml
#   3. Platform user config path (this template)
#   4. GHOST_* environment variables

# --- Subprocess LLM binaries ---
# All LLM-backed operations (reflection, resolve, supersede) shell out to a
# CLI harness — `claude`, `opencode`, `codex`, or `goose` — which owns its
# authentication and billing. Ghost has no direct Anthropic HTTP API client,
# so no provider API-key config exists. By default the binaries are resolved
# from PATH; set these to explicit paths when they live somewhere not on the
# Stop hook process's PATH (e.g. ~/.opencode/bin). Each also has a GHOST_CLI_*
# environment override; see docs/configuration.md.

# --- Local Embeddings (Ollama) ---
# Enables hybrid FTS5 + vector search. Requires Ollama running locally.
# Without this, Ghost uses FTS5 full-text search only (still very good).
# embedding:
#   enabled: true
#   ollama_url: "http://localhost:11434"
#   model: "nomic-embed-text:v1.5"   # 274MB, runs fine on CPU
#   dimensions: 768

# --- Memory Linking (requires embedding) ---
# Background worker that links similar memories into a graph. The graph feeds
# the Obsidian mirror's graph view and supersede candidate selection. A
# search-time graph-expansion ranking bonus was evaluated and removed
# (dominated by a deeper vector-k; see docs/benchmarks.md); the link graph is
# retained for the uses above. The worker itself is on by default.
# linking:
#   enabled: true
#   threshold: 0.70            # min cosine similarity to create a link
#   demotion_threshold: 0.90   # min 'related' link strength to demote a
#                              # near-duplicate from GetTopMemories/session-start
#                              # injection; stricter than threshold since
#                              # "related" isn't the same bar as "redundant"
#                              # (env: GHOST_LINKING_DEMOTION_THRESHOLD)

# --- Search ranking ---
# Cosine floor applied to the vector leg of hybrid search BEFORE RRF fusion.
# FTS candidates are exempt. 0 keeps historical behavior (only non-positive
# cosines dropped); raise to stop weak semantic matches from padding results
# when the corpus has no true match. Tune against `ghost bench`.
# search:
#   min_similarity: 0.0

# --- Subprocess LLM binary paths ---
# Same as the defaults above: the harness path override applies to every
# LLM-backed operation (reflection, resolve, supersede), not just one tier.
# Without this, auto_reflect/auto_resolve silently never fire when the binary
# is invisible to the Stop hook process's PATH.
# cli:
#   claude_binary: ""                 # e.g. "/opt/homebrew/bin/claude"
#   opencode_binary: ""               # e.g. "/Users/you/.opencode/bin/opencode"
#   codex_binary: ""                  # e.g. "/opt/homebrew/bin/codex"
#   goose_binary: ""                  # e.g. "/usr/local/bin/goose"
#   model_reflect: ""                 # pin ghost reflect's opencode harness model,
#   model_resolve: ""                 # and likewise resolve / supersede, e.g.
#   model_supersede: ""               # "opencode/big-pickle". Empty = any inherited
#                                     # GHOST_OPENCODE_MODEL, else Ghost's explicit
#                                     # opencode/big-pickle default. A configured pin
#                                     # overrides an inherited env pin for that phase.
#                                     # Applies to the opencode backend only
#                                     # (claude/codex/goose have no model flag).

# --- Memory Consolidation ---
# ghost reflect's tier is chosen via the --tier CLI flag, not config.
# reflection:
#   auto_reflect: false               # run ghost reflect --apply automatically on session stop
#   auto_resolve: false               # run ghost resolve automatically after reflect
#   auto_supersede: false             # run ghost supersede automatically after reflect
#                                     # (the enabled phases run in order: reflect, resolve, supersede)
#   lifecycle_timeout_minutes: 60     # bound each phase; 0 disables. Keep it above
#                                     # consolidation_timeout_minutes.
#   consolidation_timeout_minutes: 10 # bound ONE reflect consolidation call; 0 disables.
#                                     # Raise it for large projects: a big backlog can take
#                                     # minutes on a CLI harness, and the kill is fatal on the
#                                     # autonomous path (--require-llm has no fallback tier).

# --- Obsidian Vault Mirror ---
# One-way Markdown mirror of memories, decisions, and tasks
# (ghost obsidian export|sync). Empty vault_dir means ~/Documents/GhostVault.
# auto_sync (default false) makes the session-start hook spawn `ghost
# obsidian sync` in the background automatically. Leave it off if you don't
# use Obsidian — it's opt-in so nobody gets a vault directory or a background
# process they didn't ask for.
# obsidian:
#   vault_dir: ""                    # or set GHOST_OBSIDIAN_VAULT_DIR
#   interval: "30s"                  # sync poll cadence (Go duration, e.g. "1m")
#   auto_sync: false                 # true = auto-start sync from session-start
#                                    # (env: GHOST_OBSIDIAN_AUTO_SYNC)

# --- Scratch root budget ---
# Every harness spawn is confined to a scratch root (dataDir/scratch or
# $GHOST_SCRATCH_DIR). Before each spawn the root is checked against this
# budget: stale entries are reaped first, and a root still over budget after
# reaping warns loudly (bytes over + root path) and proceeds anyway —
# hygiene must not block maintenance, but must never be quiet. Events are
# recorded to maintenance_runs; see `ghost maintenance status`.
# 0 disables the check entirely (explicit opt-out).
# scratch:
#   max_bytes: 536870912        # 512 MiB (default)

# --- Session Injection ---
# How the SessionStart hook picks which project memories to inject. The hook
# injects a condensed selection (default 15) so the token budget is spent on
# high-signal, hard-to-derive categories (gotcha/convention/preference/decision)
# rather than descriptive architecture/fact notes the model can reconstruct by
# reading source. behavior_floor reserves that many of the slots for behavioral
# categories when the project has them; the rest are filled from the overall
# decayed-score ranking. Set behavior_floor to 0 to disable the bias and get
# the historical rank-only selection.
# injection:
#   behavior_floor: 8              # 0 = disable category bias (legacy behavior)
#                                  # (env: GHOST_INJECTION_BEHAVIOR_FLOOR)
#   behavior_categories:           # what counts as "behavioral" for the floor
#     - gotcha
#     - convention
#     - preference
#     - decision
#                                  # (env: GHOST_INJECTION_BEHAVIOR_CATEGORIES,
#                                  #  comma-separated: "gotcha,decision")
#   category_weights: {}           # optional per-category ordering boost in pass 1,
#                                  # e.g. {gotcha: 1.2} (default all 1.0)
#                                  # (env: GHOST_INJECTION_CATEGORY_WEIGHTS,
#                                  #  comma-separated: "gotcha=1.2")
#   category_caps:                 # max pass-1 reserved slots per category
#     gotcha: 4                    # default: gotcha may take at most half the
#                                  # floor so a gotcha-heavy corpus cannot fill
#                                  # every guaranteed slot with gotchas
#                                  # (env: GHOST_INJECTION_CATEGORY_CAPS,
#                                  #  comma-separated: "gotcha=4")

# --- Session routing ---
# Sessions started in your home directory or at the filesystem root match no
# project, so they normally get no memory context. default_project names a
# project (name or id) for those sessions to fall back to; empty (the default)
# keeps the no-match behavior.
# routing:
#   default_project: ""            # (env: GHOST_ROUTING_DEFAULT_PROJECT)

# --- When this file is wrong ---
# A file that exists but does not parse is reported, not ignored: CLI commands
# exit with the error, the SessionStart/Stop hooks and the `ghost mcp` server
# warn and continue on the GHOST_* environment plus the defaults above (so your
# session still works, and a GHOST_* opt-out is not undone), and `ghost mcp
# status` prints it. A key Ghost does not recognize (a typo such as
# `thresholdd`) is likewise reported, and the rest of the file still loads.
# See docs/configuration.md.
