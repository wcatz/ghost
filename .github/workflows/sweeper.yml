# Closes the review loop after the Reviewer workflow runs.
#
# Validated mechanics (wcatz/ci-mech-spike, 2026-08-25):
#   - GITHUB_TOKEN cannot resolve review threads ("not accessible by
#     integration") and cannot submit APPROVED reviews.
#   - Neither can the App. Measured 2026-09-14 (PR #430, run 34877374970):
#     with Pull requests: Read & write granted and the installation scoped
#     to this repo, the App token reports viewerCanResolve=false and
#     viewerCanReply=true on its own thread, while the repo owner reports
#     viewerCanResolve=true. GitHub gates resolution on repository write
#     access, which the Pull requests permission does not confer. Granting
#     Contents: write would confer it — and would also let a token minted
#     in the same pipeline that runs a model on untrusted diffs push code,
#     so it is deliberately not granted.
#   - Therefore merge is NOT gated on conversation resolution. It is gated
#     on the `review-gate` check run this workflow publishes, which the
#     bot can always clear because it owns it. An unresolved thread that
#     has gone outdated does not count toward the gate, so stale findings
#     stop mattering instead of needing to be swept.
#   - GITHUB_TOKEN CAN submit REQUEST_CHANGES reviews, and this workflow
#     deliberately does not. Under "Require a pull request before
#     merging", an outstanding CHANGES_REQUESTED blocks merge even with
#     required_approving_review_count: 0 — and neither GITHUB_TOKEN nor
#     the App can dismiss it, exactly as neither can resolve a thread.
#     Posting one creates a gate the bot cannot clear, which is the same
#     trap that made conversation resolution unusable. The check run is
#     the gate; a redundant blocking review is not a signal, it is a
#     deadlock. Measured on PR #431: reviewDecision=CHANGES_REQUESTED
#     from github-actions held the PR at BLOCKED after conversation
#     resolution had already been switched off.
#
# Triggered by workflow_run after each Reviewer workflow completion and by
# PR comments for manual re-runs. workflow_run executes in default-branch
# context — fine here, because nothing in this file is (or may become)
# a required status check: those attach to the wrong SHA.

name: Sweeper

on:
  workflow_run:
    workflows: ["Reviewer"]
    types: [completed]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  # Publishing the merge gate. GITHUB_TOKEN can create check runs with
  # this scope; no App identity is involved in gating.
  checks: write
  # Reading the Reviewer workflow's runs, so a comment can check whether
  # the newest run for this head completed with success.
  actions: read

concurrency:
  group: sweeper-${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  loop:
    # Runs on EVERY workflow_run conclusion, not just success. A required
    # check that is never published reads as "Expected — waiting for
    # status" and blocks the PR with no way to clear it, so the gate has
    # to be written even when the review failed, was cancelled, or was
    # skipped. What the conclusion still decides is the VALUE of the gate
    # and whether stale threads may be swept — see the step below.
    if: >-
      github.event_name == 'workflow_run' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.sender.type != 'Bot')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HAS_APP: ${{ secrets.GH_APP_ID != '' && secrets.GH_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NUMBER="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$NUMBER" ]; then
            HEAD_SHA="$(jq -r '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")"
            NUMBER="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/pulls" --jq '.[0].number // empty')"
          fi
          if [ -z "$NUMBER" ] || [ "$NUMBER" = "null" ]; then
            echo "No PR associated with this run; nothing to do."
            exit 0
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Mint app token
        id: app-token
        if: env.HAS_APP == 'true'
        # Pinned SHA (not a mutable tag) — same supply-chain convention
        # as every other action pin here. This action mints a token carrying
        # whatever permissions the review-sweeper App has, so it is the
        # highest-value pin in this pipeline.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Sweep stale findings, signal on live ones
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
          WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          # The commit the run that woke the sweeper reviewed. Empty for a
          # comment: a comment is not a run.
          WF_HEAD: ${{ github.event.workflow_run.head_sha }}
          # The path and triggering event of the run that woke the sweeper,
          # so a run that merely shares the "Reviewer" name cannot stand
          # in for the real one.
          WF_PATH: ${{ github.event.workflow_run.path }}
          WF_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          [ -n "$NUMBER" ] || { echo "no PR"; exit 0; }

          # Publishes the `review-gate` check run on the PR head.
          #
          # An earlier version swallowed its own failure and was only
          # called on the happy path, which broke the very rule this file
          # is built around: a required check that is never published
          # reads as "Expected — waiting for status" and blocks the PR
          # with nothing a re-run can clear. A transient failure in the
          # headRefOid query or in any thread page trips `set -e` and
          # aborts the step, so the final call alone was never a
          # guarantee. Publication is therefore enforced from the EXIT
          # trap and a failed publish now fails loudly.
          GATE_WRITTEN=0
          GATE_PENDING=0
          HEADREF=""
          PAGES_FILE=""

          set_gate() {
            jq -n --arg sha "$1" --arg concl "$2" \
                  --arg title "$3" --arg summary "$4" \
              '{name:"review-gate", head_sha:$sha, status:"completed",
                conclusion:$concl, output:{title:$title, summary:$summary}}' \
              | gh api "repos/$GITHUB_REPOSITORY/check-runs" \
                  --method POST --input - >/dev/null || {
              echo "::error::could not publish the review-gate check run"
              return 1
            }
            GATE_WRITTEN=1
            echo "review-gate: $2 — $3"
          }

          on_exit() {
            rc=$?
            if [ -n "$PAGES_FILE" ]; then rm -f "$PAGES_FILE"; fi
            if [ "$GATE_WRITTEN" != 1 ] && [ "$GATE_PENDING" != 1 ]; then
              if [ -n "$HEADREF" ]; then
                # Fail closed and visibly: the sweep did not finish, so
                # its verdict is unknown, but the check still exists and
                # a re-run can replace it.
                set_gate "$HEADREF" failure \
                  "The sweeper did not complete" \
                  "The sweep aborted before it could evaluate this PR's findings, so the gate fails closed. Re-run the Sweeper workflow, or push a new commit." || true
              else
                # Nothing can be published without a head SHA. The step
                # has already failed, so the job is red — which is at
                # least visible, unlike a check that never appears.
                echo "::error::the sweeper aborted before resolving the PR head SHA, so no review-gate check could be published for this commit"
              fi
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          # Cursor-paginated: first:100 alone silently skipped threads
          # past 100. That now matters more than it used to — an
          # uncounted live thread does not merely linger, it makes N_LIVE
          # too low and the review-gate check pass on a PR that still has
          # open findings. Failing to see a finding must never read as
          # not having one. The page cap bounds a pathological repo
          # (20 pages x 100 threads) so the loop can never run away.
          # shellcheck disable=SC2016
          HEADREF="$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){headRefOid}}}' \
            -f owner="${GITHUB_REPOSITORY%%/*}" \
            -f name="${GITHUB_REPOSITORY##*/}" \
            -F number="$NUMBER" \
            --jq '.data.repository.pullRequest.headRefOid')"

          # The conclusion the gate is allowed to trust. For a run that
          # woke the sweeper it is the run's own; for a comment it is the
          # newest Reviewer run for this head, looked up below, because a
          # comment is not a run and cannot vouch for one. An empty value
          # means no run was found, and the gate fails closed on that.
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            WF_PATH_CLEAN="${WF_PATH%%@*}"
            if [ "$WF_PATH_CLEAN" = ".github/workflows/reviewer.yml" ] \
               && [ "$WF_EVENT" = "pull_request" ]; then
              RUN_CONCLUSION="$WF_CONCLUSION"
              RUN_HEAD="$WF_HEAD"
            else
              RUN_CONCLUSION=""
              RUN_HEAD=""
            fi
          else
            RUN_CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEADREF&event=pull_request&per_page=100" 2>/dev/null \
              | jq -r '[.workflow_runs[] | select((.path | split("@")[0]) == ".github/workflows/reviewer.yml" and .event == "pull_request")] | sort_by(.created_at) | reverse | .[0].conclusion // empty' 2>/dev/null)" || RUN_CONCLUSION=""
            RUN_HEAD=""
          fi
          [ -n "$RUN_CONCLUSION" ] || RUN_CONCLUSION=""

          # The decision is ONE tested script (.github/scripts/review_gate.py)
          # and the question it asks - which commits a review of the review
          # bot's own says were reviewed - is another
          # (.github/scripts/review_marker.py). Both are read from the
          # TRUSTED base: the default branch, at the commit this workflow
          # file itself came from (GITHUB_SHA is the default branch's tip
          # for both events this workflow runs on). The pull request
          # cannot edit them.
          #
          # The sweeper checks nothing out - it runs with the
          # pull-requests and checks scopes only, and no scope is added
          # here - so the scripts are read over the repository's own raw
          # endpoint, which serves the file at the commit named in the
          # URL. That is the same base the reviewer reads its scripts
          # from, and the same one the pull request cannot reach.
          SCRIPTS="${RUNNER_TEMP}/sweeper-scripts"
          mkdir -p "$SCRIPTS"
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/scripts"
          for script in review_gate.py review_marker.py; do
            if ! curl -fsSL "${BASE}/${script}" -o "${SCRIPTS}/${script}"; then
              echo "::error::could not read the trusted ${script} from the base branch"
              exit 1
            fi
          done

          # A marker counts only when the review carrying it was posted by
          # the review bot itself — the app the workflow mints, or the
          # workflow token it falls back to. The review author must be
          # exactly `github-actions[bot]` or `review-sweeper[bot]` with
          # user type `Bot`. Nobody else says what has been reviewed.
          REVIEWS_FILE="$(mktemp)"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/reviews" --paginate \
            > "$REVIEWS_FILE" 2>/dev/null || : > "$REVIEWS_FILE"
          report="$(python3 -I "${SCRIPTS}/review_marker.py" \
            --reviews "$REVIEWS_FILE" --head "$HEADREF" 2>/dev/null)" || report=""
          rm -f "$REVIEWS_FILE"
          JUDGED="$(printf '%s' "$report" | jq -r '.judged // false' 2>/dev/null)"
          [ "$JUDGED" = "true" ] || JUDGED=false

          # A gate that is still PENDING on REVIEW-UNAVAILABLE is the
          # review's own report that the models were unavailable: an
          # outage, not a verdict. It is left pending while NO review
          # judged this head — the review that just ran produced
          # nothing — because a completed gate published here would
          # replace it with a verdict nobody reached. A green gate on a
          # pull request nothing judged is the harm the pending gate
          # exists to avoid.
          #
          # A review that DOES judge this head completes it: the gate
          # published below is the newer check run of the same name, and
          # a re-run of the review is what the gate has always meant.
          #
          # The title is the one the Reviewer workflow publishes
          # (.github/workflows/reviewer.yml, the publish-pending-gate
          # job) and the one the scheduled retry looks for
          # (.github/workflows/review-retry.yml).
          PENDING_TITLES="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEADREF/check-runs" --paginate \
            --jq '.check_runs[] | select(.name == "review-gate" and .status != "completed") | .output.title // ""')"
          PENDING_ARGS=()
          while IFS= read -r title; do
            [ -n "$title" ] || continue
            PENDING_ARGS+=(--pending-title "$title")
          done <<< "$PENDING_TITLES"

          # The first question: the one that needs no thread counts. A
          # run that did not complete, a run that was skipped, a run that
          # judged another commit, and a head no review judged all have
          # their answer here — and none of them is a green gate. A run
          # that succeeded on another commit, or an empty run head, says
          # nothing about the commit the pull request is on now.
          #
          # No judgement was produced for this commit, so the gate fails
          # closed. It is still WRITTEN — leaving it unpublished would
          # read as "Expected — waiting for status" forever, which blocks
          # the PR with nothing a re-run can clear.
          pre="$(python3 -I "${SCRIPTS}/review_gate.py" --mode pre \
            --event "$GITHUB_EVENT_NAME" \
            --conclusion "$RUN_CONCLUSION" \
            --run-head "$RUN_HEAD" \
            --head "$HEADREF" \
            --judged "$JUDGED" \
            "${PENDING_ARGS[@]}" 2>/dev/null)" || pre=""
          pre_publish="$(printf '%s' "$pre" | jq -r '.publish // empty' 2>/dev/null)"
          pre_title="$(printf '%s' "$pre" | jq -r '.title // empty' 2>/dev/null)"
          pre_summary="$(printf '%s' "$pre" | jq -r '.summary // empty' 2>/dev/null)"
          pre_reason="$(printf '%s' "$pre" | jq -r '.reason // empty' 2>/dev/null)"
          if [ -z "$pre_publish" ]; then
            # A script that does not answer decides nothing, and a gate
            # that cannot be evaluated fails closed.
            echo "::error::the gate decision script did not answer"
            exit 1
          fi
          case "$pre_publish" in
            none)
              echo "::notice::the review-gate is pending on REVIEW-UNAVAILABLE and is left pending: ${pre_reason}"
              GATE_PENDING=1
              exit 0
              ;;
            success|failure)
              echo "review-gate decision: ${pre_publish} — ${pre_reason}"
              set_gate "$HEADREF" "$pre_publish" "$pre_title" "$pre_summary"
              exit 0
              ;;
            *)
              # The reviewer's threads decide the rest.
              ;;
          esac

          PAGES_FILE="$(mktemp)"
          CURSOR_ARG=()
          for _ in $(seq 1 20); do
            # shellcheck disable=SC2016
            PAGE="$(gh api graphql \
              -f query='query($owner:String!,$name:String!,$number:Int!,$cursor:String){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$number){
                    reviewThreads(first:100,after:$cursor){
                      nodes{
                        id isResolved isOutdated
                        comments(first:1){nodes{author{login}}}
                      }
                      pageInfo{hasNextPage endCursor}
                    }
                  }
                }}' \
              -f owner="${GITHUB_REPOSITORY%%/*}" \
              -f name="${GITHUB_REPOSITORY##*/}" \
              -F number="$NUMBER" "${CURSOR_ARG[@]}" \
              --jq '.data.repository.pullRequest.reviewThreads')"
            echo "$PAGE" >> "$PAGES_FILE"
            [ "$(jq -r '.pageInfo.hasNextPage' <<<"$PAGE")" != "true" ] && break
            CURSOR_ARG=(-f cursor="$(jq -r '.pageInfo.endCursor' <<<"$PAGE")")
          done

          THREADS="$(jq -n --arg head "$HEADREF" \
            '{headRefOid: $head,
              reviewThreads: {nodes: [inputs | .nodes[]]}}' \
            "$PAGES_FILE" 2>/dev/null || echo '{"headRefOid":"","reviewThreads":{"nodes":[]}}')"

          # isOutdated is a proxy, not a verdict: a thread goes outdated
          # when the diff line it was anchored to changes or disappears,
          # which can happen while the finding itself still applies. The
          # sweep trusts the fresh review that just completed to have
          # re-flagged anything still relevant on the new diff — the
          # accepted trade-off for never letting a dead thread block merge.
          STALE="$(echo "$THREADS" | jq '[.reviewThreads.nodes[]
            | select(.isResolved==false and .isOutdated==true)
            | select((.comments.nodes[0].author.login // "") == "github-actions[bot]"
              or (.comments.nodes[0].author.login // "") == "review-sweeper[bot]") | .id]')"

          LIVE="$(echo "$THREADS" | jq '[.reviewThreads.nodes[]
            | select(.isResolved==false and .isOutdated==false)
            | select((.comments.nodes[0].author.login // "") == "github-actions[bot]"
              or (.comments.nodes[0].author.login // "") == "review-sweeper[bot]") | .id]')"

          N_STALE="$(jq length <<<"$STALE")"
          N_LIVE="$(jq length <<<"$LIVE")"

          # The rest of the decision: the reviewer's threads. The head was
          # judged, so the verdict is the findings that are still open
          # against it.
          decision="$(python3 -I "${SCRIPTS}/review_gate.py" --mode gate \
            --event "$GITHUB_EVENT_NAME" \
            --conclusion "$RUN_CONCLUSION" \
            --run-head "$RUN_HEAD" \
            --head "$HEADREF" \
            --judged "$JUDGED" \
            --live "$N_LIVE" \
            --stale "$N_STALE" \
            "${PENDING_ARGS[@]}" 2>/dev/null)" || decision=""
          publish="$(printf '%s' "$decision" | jq -r '.publish // empty' 2>/dev/null)"
          title="$(printf '%s' "$decision" | jq -r '.title // empty' 2>/dev/null)"
          summary="$(printf '%s' "$decision" | jq -r '.summary // empty' 2>/dev/null)"
          sweep_ok="$(printf '%s' "$decision" | jq -r '.sweep // false' 2>/dev/null)"
          reason="$(printf '%s' "$decision" | jq -r '.reason // empty' 2>/dev/null)"
          if [ -z "$publish" ]; then
            echo "::error::the gate decision script did not answer"
            exit 1
          fi
          echo "review-gate decision: ${publish} — ${reason}"

          # A stale thread may only be swept when a review actually
          # judged this commit. The decision says so: a run that judged
          # nothing - a skipped run, a run that judged another commit -
          # has no judgement to sweep on, and resolving on its strength
          # would clear findings nothing re-checked. That loss is
          # permanent, not cosmetic: reviewer.yml feeds resolved threads
          # back to the model as dismissed, so a still-valid finding
          # swept here is never re-raised. A comment is not a review
          # either, so it never sweeps.
          if [ "$N_STALE" -gt 0 ] && [ "$sweep_ok" != "true" ]; then
            echo "not sweeping $N_STALE stale thread(s): nothing judged this commit."
          elif [ "$N_STALE" -gt 0 ]; then
            if [ -n "$APP_TOKEN" ]; then
              RESOLVED=0
              for id in $(jq -r .[] <<<"$STALE"); do
                # shellcheck disable=SC2016
                if GH_TOKEN="$APP_TOKEN" gh api graphql \
                     -f query='mutation($id:ID!){resolveReviewThread(input:{threadId:$id}){thread{isResolved}}}' \
                     -f id="$id" --jq '.data.resolveReviewThread.thread.isResolved' >/dev/null 2>&1; then
                  RESOLVED=$((RESOLVED+1))
                fi
              done
              echo "Auto-resolved $RESOLVED/$N_STALE stale finding(s) (superseded by newer review)."
              if [ "$RESOLVED" -lt "$N_STALE" ]; then
                echo "note: $((N_STALE - RESOLVED)) stale thread(s) stayed unresolved — the App cannot resolve threads (measured: viewerCanResolve=false under Pull requests: read+write; see the header). This does not block merge: an outdated thread is not live, so it carries no weight in the review-gate check."
              fi
            else
              echo "::warning::$N_STALE stale finding(s) await resolution — configure the GH_APP_ID / GH_APP_PRIVATE_KEY secrets to enable auto-resolve."
            fi
          fi

          if [ "$N_LIVE" -gt 0 ]; then
            echo "$N_LIVE live reviewer finding(s) — the review-gate check below will fail."
          else
            echo "No live reviewer findings."
          fi

          # The merge gate. Live means unresolved AND not outdated, so a
          # finding clears it in either of the two ways that should clear
          # it: the author fixes the code (the thread goes outdated) or a
          # human resolves the thread. Nothing here needs a capability the
          # bot lacks.
          case "$publish" in
            success)
              set_gate "$HEADREF" success "$title" "$summary"
              ;;
            failure)
              set_gate "$HEADREF" failure "$title" "$summary"
              ;;
            *)
              # Nothing is published: a gate that is waiting for a review
              # keeps waiting.
              GATE_PENDING=1
              echo "::notice::no gate published: ${reason}"
              ;;
          esac
