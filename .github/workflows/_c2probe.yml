name: c2-probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Probe the git-push route for GITHUB_TOKEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B c2probe-work origin/main

          echo "c2 probe" > .c2probe
          git add .c2probe
          git commit \
            -m "chore: c2 probe" \
            -m "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          set +e
          PUSH1="$(git push origin HEAD:main 2>&1)"
          RC1=$?
          set -e
          echo "--- push1 rc=${RC1} ---"
          echo "${PUSH1}"

          if [ "${RC1}" -ne 0 ]; then
            echo "FAIL: probe push rejected: ${PUSH1}"
            exit 1
          fi

          git rm -f .c2probe
          git commit \
            -m "chore: remove c2 probe" \
            -m "Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          set +e
          PUSH2="$(git push origin HEAD:main 2>&1)"
          RC2=$?
          set -e
          echo "--- push2 rc=${RC2} ---"
          echo "${PUSH2}"

          if [ "${RC2}" -ne 0 ]; then
            echo "FAIL: probe removal push rejected: ${PUSH2}"
            exit 1
          fi

          echo "PASS: both GITHUB_TOKEN git pushes to main succeeded"
