name: Reviewer

on:
  pull_request:
    # No paths filter. Docs were excluded on the theory that prose has
    # nothing to review, but this repo's docs make checkable claims about
    # the code — run numbers, file paths, API shapes, "X is wired to Y" —
    # and those go stale silently. The prompt below reviews a prose diff
    # as documentation rather than as Go.
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Must stay above the model step's own timeout plus the ~3 min of
    # checkout/install/prepare ahead of it, or the job ceiling kills the
    # run first and the step timeout never fires.
    timeout-minutes: 35
    # Fork PRs get a read-only token and no repo secrets by GitHub's design,
    # so the App mint below would fail and the whole pipeline would run
    # anyway, wasting an LLM invocation to reach a guaranteed failure at
    # Post review. Skip renders as skipped, not a red X. Making fork PRs
    # work would require pull_request_target, which would run base-repo
    # secrets against attacker-controlled code — a deliberate non-goal.
    # Dependabot PRs are same-repo, so the fork test above passes, but
    # GitHub still hands them a read-only token and withholds repo
    # secrets. The App mint would degrade and Post review would then
    # 403 — a red X on every dependency bump. Skip for the same reason
    # fork PRs are skipped: a guaranteed failure is not worth an LLM run.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # The model step must not reach any write-scoped credential, not
          # via env and not via .git/config http.extraheader.
          persist-credentials: false

      # post_review.py runs with the App token in its environment, so it has
      # to come from the base branch and never from the PR. The checkout
      # above is the pull_request MERGE ref, which already carries the PR's
      # own edits, so copying the scripts out of it would not do: a same-repo
      # PR that edits post_review.py would get its edited version executed as
      # review-sweeper[bot]. Reading the trusted copy from base.sha is the
      # same defence the `git show "origin/${GITHUB_BASE_REF}:..."` read in
      # Prepare already applies to the conventions file.
      #
      # It also fixes a plain bug: `gh pr checkout` below replaces the
      # workspace with the head tree, and a branch cut before the scripts
      # landed on main has no .github/scripts at all — the review then dies
      # at Post review with ENOENT (observed on PR #418, run 34869517878).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The DEFAULT branch, not base.sha and not base_ref.
          #
          # base.sha is the base tip as of the PR's last sync, which for
          # an older PR can predate the scripts entirely: #416 and #417
          # resolved it to e29cc2c, before .github/scripts existed, and
          # were skipped instead of reviewed (run 34884927202).
          #
          # base_ref is no better: for a PR stacked on a feature branch
          # cut before the scripts landed, the target branch tip also
          # predates them, and this step would fail a PR whose author
          # cannot fix it by pushing.
          #
          # The default branch is where these scripts live and is exactly
          # as trusted as any other base commit, so it is the one ref
          # that is both always current and always present.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/scripts
          path: .base-scripts

      # The release CDN 504s from Actions runners often enough to kill
      # reviews outright (runs 34857548998 and 34857888005 both died on
      # it, the second after six retries over 10s, while the same URL
      # served 200 from outside Actions). A cache hit skips the network
      # entirely. Caching the TARBALL rather than the unpacked binary is
      # deliberate: the Actions cache is writable by any branch in this
      # repo, so a cache entry is not trustworthy input, and the existing
      # SHA256 check below runs on every path — hit or miss — which makes
      # a poisoned entry fail closed instead of executing.
      #
      # continue-on-error: without it this step trades one fatal
      # transient-infra dependency (the CDN) for another (the cache
      # service), and the cache one fails BEFORE the checksum-guarded
      # recovery in Install can run. A failed restore is fully
      # recoverable — Install just downloads — so it must not end the
      # review.
      #
      # The key carries the expected SHA256 prefix, not just the version.
      # actions/cache never overwrites an existing key and skips its save
      # on an exact hit, so a fixed key is a one-way door: re-issue the
      # 1.18.30 artifact and the key would still match the stale entry
      # forever. Rotating the SHA rotates the key. Residual, accepted
      # limitation: a poisoned entry under the current key is restored,
      # fails the checksum, is re-downloaded, and cannot be re-saved
      # (the key already exists), so the cache degrades to a permanent
      # miss — the pre-cache behaviour, never an execution of foreign
      # bytes.
      - name: Cache the opencode tarball
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/opencode.tar.gz
          key: opencode-tarball-linux-x64-2.0.15-5ba4e87d9ee5dd5c

      - name: Install opencode
        # Binary from GitHub Releases with SHA256 verification — no
        # unpinned curl|bash. The PATH export is REQUIRED: the old
        # curl|bash installer wrote $GITHUB_PATH itself, and dropping it
        # is what gave PR #421 "opencode: command not found" (exit 127).
        run: |
          mkdir -p "$HOME/.opencode/bin"
          # opencode V2 ships as the npm package @opencode/cli-<target>
          # (that is what https://opencode.ai/v2/install downloads), not as
          # a GitHub release asset. OC_SHA256 is the sha256 of that exact
          # registry tarball; its sha512 matches the registry's published
          # dist.integrity (sha512-PGVHuIb6...), cross-checked 2026-09-25.
          # V1 (1.18.31) could no longer run the read-only agent on any free
          # model (opaque UnknownError), which is why the pin moved to V2.
          #
          # History, V1: the anonymous free tier ratchets on client version: on
          # 2026-09-19, 1.18.30 began failing every call with a 403
          # FreeTierError ("OpenCode's free tier can only be used from
          # within OpenCode") while 1.18.31 succeeded at cost 0 — but only
          # for a default agent; custom agents with a tools map or a
          # permission override were still rejected (the reason V1 used the paid go
          # tier below).
          # If a future bump fails fast with that error again, bump
          # OC_VERSION and OC_SHA256 here (and the cache key above) before
          # anything else.
          OC_VERSION=2.0.15
          OC_SHA256=5ba4e87d9ee5dd5ce3aa45acdba1c6d37acdd282d450d6b65fb45226d6da44cc
          OC_URL="https://registry.npmjs.org/@opencode/cli-linux-x64/-/cli-linux-x64-${OC_VERSION}.tgz"
          # A restored cache entry is untrusted input: drop it rather
          # than let a bad one wedge the pipeline until the cache expires.
          if [ -f /tmp/opencode.tar.gz ] \
             && ! echo "${OC_SHA256}  /tmp/opencode.tar.gz" \
                  | sha256sum -c - >/dev/null 2>&1; then
            echo "::warning::cached opencode tarball failed its checksum — re-downloading"
            rm -f /tmp/opencode.tar.gz
          fi
          if [ ! -f /tmp/opencode.tar.gz ]; then
            # curl retries 408/429/5xx by default; --retry-connrefused
            # adds the refused-connection case. ~60s of budget, because a
            # 10s budget was measured to be too short.
            curl -fsSL --proto '=https' --tlsv1.2 \
              --retry 10 --retry-delay 6 --retry-connrefused \
              -o /tmp/opencode.tar.gz "$OC_URL"
          fi
          # Unconditional: this is the check that makes both the download
          # and the cache safe.
          echo "${OC_SHA256}  /tmp/opencode.tar.gz" | sha256sum -c -
          tar -xzf /tmp/opencode.tar.gz -C "$HOME/.opencode/bin" --strip-components=2 package/bin/opencode
          chmod +x "$HOME/.opencode/bin/opencode"
          "$HOME/.opencode/bin/opencode" --version
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Install the read-only reviewer agent
        # Restricts the model to tools that only READ. This is what stops
        # the model routing its answer through a tool call: run
        # 34878398658 emitted the whole findings document as a tool part's
        # payload, post_review.py refused to read tool output (that output
        # echoes the attacker-controlled diff, so the text-part allowlist
        # is deliberate), and the review failed with "no JSON object with
        # a 'verdict' key". With no write/patch/edit/bash/task/todowrite
        # tool registered there is no such channel to reach for.
        #
        # $HOME, NOT the workspace: "Prepare review context" runs
        # `gh pr checkout`, which replaces the tree, and then sweeps
        # .opencode directories out of it as untrusted input. A
        # workspace-local agent file would be destroyed by the first and
        # forgeable by the PR through the second. XDG_CONFIG_HOME is
        # unset on the runner, so opencode falls back to ~/.config —
        # verified locally with `env -u XDG_CONFIG_HOME`.
        #
        # The tools map is belt and braces: the "*" wildcard denies
        # anything the binary gains in a future version, and every tool
        # id the pinned binary knows is then listed explicitly, because
        # the wildcard's semantics are not documented.
        run: |
          # THE model pin. Verified: frontmatter `model:` is honoured with
          # no -m flag. Keeping it here rather than on the run command
          # puts it next to the tool restrictions, so rotating the model
          # is a one-line edit in one place.
          #
          # MODELS is an ordered list of FREE models, tried in turn by the
          # Review step; the first is also written into the agent file.
          # No API key: the review runs on the anonymous free tier, so it
          # never spends account credits. Verified 2026-09-25 on 2.0.15:
          # opencode/space-bunny-free accepts this read-only agent (tools
          # map) anonymously, while opencode/big-pickle and
          # opencode/mimo-v2.6-flash-free reject it with 403 FreeTierError
          # ("OpenCode's free tier can only be used from within OpenCode")
          # even when authenticated. They stay in the list so the review
          # picks them up automatically if the free tier relaxes. Free
          # models rotate: when the first one disappears from the catalog,
          # the preflight below warns, and this line is the only place to
          # change. V2 ignores the agent file's model: line, so the Review
          # step passes -m explicitly.
          MODELS="opencode/space-bunny-free opencode/big-pickle opencode/mimo-v2.6-flash-free"
          MODEL=${MODELS%% *}
          mkdir -p "$HOME/.config/opencode/agent"
          AGENT=$HOME/.config/opencode/agent/ghost-reviewer.md
          # Only the model line interpolates. The rest stays in a QUOTED
          # heredoc so that a future edit to the system prompt cannot be
          # expanded by the shell: a stray backtick or $ in prose would
          # otherwise become command substitution in a step that runs
          # before the untrusted tree is even checked out.
          printf '%s\n' \
            '---' \
            'description: Read-only PR reviewer for the ghost codebase' \
            'mode: primary' \
            "model: ${MODEL}" > "$AGENT"
          cat >> "$AGENT" <<'AGENT_EOF'
          tools:
            "*": false
            read: true
            grep: true
            glob: true
            list: true
            write: false
            edit: false
            patch: false
            bash: false
            task: false
            todowrite: false
            webfetch: false
            question: false
            invalid: false
          ---
          You review code and print your answer as plain text. You have no
          tool that can write, edit, patch, run a command, fetch a URL, or
          record a task, and no way to ask a question — this is a
          non-interactive run. Never attempt to emit your answer through a
          tool call: your final message must itself be the answer.
          AGENT_EOF
          # A silently unregistered agent would fall back to the default
          # tool set, which is the bug this step exists to prevent.
          # V2 has no `agent list`; `debug agents` prints every resolved
          # agent as JSON, including the permissions the tools map became.
          # Require the agent AND a bash deny, so a V2 change that silently
          # drops the tools map cannot hand the model a shell.
          opencode debug agents > agents.json 2>/dev/null || true
          jq -e '.[] | select(.id == "ghost-reviewer")
                 | .permissions | any(.action == "bash" and .effect == "deny")' \
            agents.json >/dev/null || {
            echo "::error::ghost-reviewer agent did not register with bash denied — refusing to review with the default (write-capable) tool set"
            jq '[.[] | {id, permissions}]' agents.json || cat agents.json || true
            exit 1
          }

          # Model ids are provider-scoped (opencode/..., not a bare
          # codename). The run is keyless, so the catalog is the anonymous
          # tier's — the same one the free models in MODELS come from — and
          # a miss here really does mean the first model was rotated out.
          # The Review step still tries the rest of MODELS in order.
          #
          # This check only improves that message. It never decides
          # whether the review runs: `opencode models` at 1.18.30 prints
          # one provider-qualified id per bare line, but that is an
          # observed format, not a contract, and a version bump could
          # change it. Hard-failing on an unmatched id would then block
          # every review on the repo to guard against a rotation that
          # already fails loudly on its own. So: warn, and let the run
          # produce the real verdict.
          if catalog=$(opencode models 2>/dev/null) && [ -n "$catalog" ]; then
            printf '%s\n' "$catalog" | grep -qxF "$MODEL" \
              || echo "::warning::${MODEL} (first of MODELS) is not in the opencode model catalog. Either it was rotated or retired — if the review step now fails with an opaque gateway error, that is why, and MODEL in this step is the only place to change it — or 'opencode models' no longer prints one provider-qualified id per line, in which case this preflight is stale and the review below is unaffected."
          else
            echo "::warning::could not read the opencode model catalog — skipping the ${MODEL} preflight"
          fi

      - name: Prepare review context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          # Move the trusted scripts out of the workspace before the head
          # tree lands on top of them and before the model runs against it.
          rm -rf "${RUNNER_TEMP}/base-scripts"
          # Reading from the default branch, this can only fire if the
          # default branch has no .github/scripts — a genuine
          # misconfiguration, not an artefact of an old PR or an older
          # base branch. So it fails rather than skips.
          #
          # Skipping here was actively harmful: with no review posted
          # there are no findings, so the sweeper's review-gate came out
          # green and an unreviewed PR satisfied a required check. That
          # is worse than a red X — it is a gate that reads as "nothing
          # wrong" when it means "nothing looked". Failing makes the
          # sweeper publish a failing gate instead.
          #
          # % is a legal ref-name character and Actions decodes %25/%0A/%0D
          # in a workflow-command message, so a branch named
          # 'x%0A::stop-commands::y' would inject a command here. Escaping
          # % alone covers it: a real newline cannot occur in a ref name.
          if [ ! -d .base-scripts/.github/scripts ]; then
            base_ref_safe="${GITHUB_BASE_REF//%/%25}"
            echo "::error::base branch ${base_ref_safe} has no .github/scripts — refusing to review with an untrusted copy, and refusing to pass silently"
            exit 1
          fi
          mv .base-scripts/.github/scripts "${RUNNER_TEMP}/base-scripts"
          rm -rf .base-scripts
          gh pr checkout "$PR_NUMBER"
          # gh pr checkout fetches at fetch-depth 1; the prior reviewed
          # commit is not present in a shallow clone, so the incremental
          # diff below would always fall back to a full review.
          git fetch --unshallow origin 2>/dev/null || git fetch --deepen=50 origin || true
          git config --local --unset-all http.extraheader 2>/dev/null || true
          git config --local --remove-section 'http.https://github.com/' 2>/dev/null || true

          gh pr view "$PR_NUMBER" --json title --jq .title > pr.title
          gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid > pr.head
          # Review only what changed since the last review. The marker is
          # written into the review body by build_review(); reading it back
          # keeps this independent of the summary comment (phase 4).
          #
          # `gh api --paginate` applies --jq to EACH page separately and
          # concatenates the results, so a PR with more than one page of
          # reviews emits one SHA per page and LAST_SHA would become a
          # multi-line string that `git cat-file -e` rejects, silently
          # forcing a full review forever. `tail -n 1` keeps the newest.
          # gh sets per_page=100 when paginating (verified against
          # pulls/421/reviews: 32 reviews -> 1 page; per_page=10 -> 4
          # separate --jq outputs), so this only bites past 100 reviews —
          # rare, but PR #421 reached 32 unattended.
          LAST_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            --paginate --jq '[.[] | .body
              | capture("<!-- ghost-review:(?<sha>[0-9a-f]{7,40}) -->")?.sha]
              | last // empty' 2>/dev/null | tail -n 1 || true)"

          if [ -n "$LAST_SHA" ] && git cat-file -e "${LAST_SHA}^{commit}" 2>/dev/null; then
            echo "incremental review: ${LAST_SHA}..HEAD"
            git diff "${LAST_SHA}" HEAD > pr.diff
          else
            echo "full review (no usable prior marker)"
            gh pr diff "$PR_NUMBER" > pr.diff
          fi

          # An incremental diff can be empty when a push changed nothing
          # reviewable (e.g. a rebase with no content change). Skip rather
          # than burn a model run on an empty diff.
          if [ ! -s pr.diff ]; then
            echo "no reviewable change since ${LAST_SHA}; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

          # Conventions come from the BASE ref, which is not
          # attacker-controllable, unlike the PR head tree. They are
          # extracted to files here because .git is deleted below, and are
          # deliberately NOT named CLAUDE.md/AGENTS.md: the injection sweep
          # would delete them, and opencode would auto-load them outside
          # our prompt's control.
          mkdir -p .review-context
          git fetch --depth=1 origin "${GITHUB_BASE_REF}" 2>/dev/null || true
          for f in best_practices.md CLAUDE.md; do
            git show "origin/${GITHUB_BASE_REF}:${f}" 2>/dev/null \
              >> .review-context/conventions.md || true
          done
          [ -s .review-context/conventions.md ] \
            || echo "(no repo conventions found on the base ref)" \
               > .review-context/conventions.md

          # Existing bot threads become prompt input so the model does not
          # re-raise what is already open or already dismissed. Without
          # this the reviewer re-derives findings from scratch every push
          # and oscillates (PR #421: 32 reviews, verdict flipping between
          # clean and should-fix on identical code).
          # Cursor-paginated for the same reason sweeper.yml is: a bare
          # first:100 silently drops everything past the hundredth
          # thread. There the cost is a stale thread blocking merge
          # forever; here it is the reviewer losing memory of findings it
          # already made and re-raising them — the exact oscillation
          # prior-threads.json exists to prevent. The 20-page cap bounds
          # a pathological PR so the loop cannot run away.
          #
          # A failed query and a PR with no prior threads both used to
          # print "[]", so a broken query was indistinguishable from a
          # clean slate — the reviewer would silently lose its memory and
          # nothing in the log would say so. Report the two separately.
          PT_PAGES="$(mktemp)"
          PT_ERR="$(mktemp)"
          PT_OK=1
          PT_CURSOR=()
          for _ in $(seq 1 20); do
            # shellcheck disable=SC2016
            PT_PAGE="$(gh api graphql -f query='
              query($owner:String!,$name:String!,$number:Int!,$cursor:String){
                repository(owner:$owner,name:$name){
                  pullRequest(number:$number){
                    reviewThreads(first:100,after:$cursor){
                      nodes{
                        isResolved
                        comments(first:1){nodes{author{login} path line body}}
                      }
                      pageInfo{hasNextPage endCursor}
                    }}}}' \
              -f owner="${GITHUB_REPOSITORY%%/*}" \
              -f name="${GITHUB_REPOSITORY##*/}" \
              -F number="$PR_NUMBER" "${PT_CURSOR[@]}" \
              --jq '.data.repository.pullRequest.reviewThreads' \
              2>>"$PT_ERR")" || { PT_OK=0; break; }
            printf '%s\n' "$PT_PAGE" >> "$PT_PAGES"
            [ "$(jq -r '.pageInfo.hasNextPage' <<<"$PT_PAGE")" != "true" ] && break
            PT_CURSOR=(-f cursor="$(jq -r '.pageInfo.endCursor' <<<"$PT_PAGE")")
          done

          if [ "$PT_OK" = 1 ] && jq -n '[inputs | .nodes[]
                 | select((.comments.nodes[0].author.login // "")
                     | startswith("github-actions") or startswith("review-sweeper"))
                 | {resolved: .isResolved,
                    path: .comments.nodes[0].path,
                    line: .comments.nodes[0].line,
                    title: (.comments.nodes[0].body | split("\n")[0])}]' \
                 "$PT_PAGES" > .review-context/prior-threads.json 2>>"$PT_ERR"; then
            echo "prior threads: $(jq 'length' .review-context/prior-threads.json \
              2>/dev/null || echo '?') bot thread(s)"
          else
            echo "::warning::prior-threads query FAILED — this review cannot see its own open threads and may re-raise them"
            # Prefixed with '> ': gh error text can quote a branch name,
            # and a line starting with '::' would otherwise be executed
            # as a workflow command.
            sed -n '1,5p' "$PT_ERR" | sed 's/^/> /'
            echo '[]' > .review-context/prior-threads.json
          fi
          rm -f "$PT_PAGES" "$PT_ERR"

          # The head tree is attacker-controllable and opencode auto-loads
          # instruction files from it hierarchically. Strip recursively,
          # then delete .git so they cannot be recovered via git show.
          # -iname (not -name): runner filesystems are case-sensitive, and
          # e.g. Agents.md/claude.md would otherwise survive this sweep.
          find . -path ./.review-context -prune -o \
            \( -iname AGENTS.md -o -iname CLAUDE.md -o -iname .mcp.json \
            -o -iname opencode.json -o -iname opencode.jsonc \
            -o -iname .opencode \) -exec rm -rf {} + 2>/dev/null || true

          # A symlink under a name the sweep above doesn't match can still
          # point outside this checkout; `find` without -L doesn't descend
          # into it, so it survives untouched and content from outside the
          # checkout can be read through it and quoted into a posted
          # finding. Symlinks are removed wholesale rather than resolved
          # and classified: a reviewer does not need to follow symlinks to
          # read a diff, and classification (readlink -f, symlink chains,
          # races) is exactly the kind of thing that gets an edge case
          # wrong.
          find . -path ./.review-context -prune -o -type l -exec rm -f {} + 2>/dev/null || true
          rm -rf .git

      - name: Review with opencode
        if: steps.context.outputs.skip != 'true'
        # 15 was cutting it fine: run 34892821126 took 12m51s. The
        # read-only agent reads more than the write-capable one did (21
        # tool calls against 9 on a comparable diff) because it has no
        # shortcut, so a larger diff would have tripped it.
        timeout-minutes: 25
        # Keyless on purpose: every model in MODELS is a free-tier model,
        # so there is no credential in this step at all and a review can
        # never spend account credits. (Until 2026-09-25 this step ran a
        # paid go-endpoint model via OPENCODE_API_KEY; when that balance ran
        # out every review failed with an opaque gateway error.)
        env:
          MODELS: opencode/space-bunny-free opencode/big-pickle opencode/mimo-v2.6-flash-free
        run: |
          cd "${GITHUB_WORKSPACE}"
          # Hard-fail rather than hand a credential to a model fed
          # untrusted input. A set-but-EMPTY var is harmless, so the test
          # is on the value.
          for v in GITHUB_TOKEN GH_TOKEN ACTIONS_RUNTIME_TOKEN \
                   ACTIONS_ID_TOKEN_REQUEST_TOKEN AWS_WEB_IDENTITY_TOKEN_FILE; do
            if [ -n "${!v}" ]; then
              echo "::error::credential \$$v present in the model step — refusing to run"
              exit 1
            fi
          done

          # Capture stdout to a file; the model writes NOTHING to disk
          # (--agent ghost-reviewer registers read-only tools only).
          # post_review.py recovers the JSON from the reply via
          # extract_findings().
          #
          # --format json emits raw JSON events rather than a single blob,
          # so the reply text is spread across events; extract_findings
          # scans the whole stream for balanced objects, which is why it
          # tolerates that shape where #421's parts[-1] did not.
          REVIEW_PROMPT="You are a senior Go code reviewer for the ghost codebase (Go 1.26+, modernc.org/sqlite, no CGO).

          Read ./pr.title, ./pr.diff, and ./.review-context/conventions.md. The diff is authoritative for changed lines; do NOT re-derive it. Read the changed files in this checkout to verify each finding.

          This checkout is NOT the repository. Before you were started, these paths were deleted from it so that a pull request cannot steer its own review: AGENTS.md, CLAUDE.md, .mcp.json, opencode.json, opencode.jsonc, .opencode, every symlink, and .git. Their absence here is NOT evidence that they are absent from the repository, and a reference to any of them is NOT a dead reference. The content of CLAUDE.md is in ./.review-context/conventions.md, copied from the base ref under a different name for the same reason. Do NOT run commands and do NOT narrate your process. Also read ./.review-context/prior-threads.json — findings you already raised on this PR. Entries with \"resolved\": false are STILL OPEN: do not raise them again. Entries with \"resolved\": true were dismissed: do not raise them again unless the code changed in a way that makes the original concern newly valid.

          Cover: correctness bugs, race conditions, error-handling gaps, and breaking changes to MCP tool contracts or the SQLite schema. Do NOT report style preferences — golangci-lint handles those.

          Reply with ONLY a JSON document matching exactly this schema — no preamble, no explanation, no markdown fence. Your FINAL message must be the JSON itself, printed as text. Do NOT put the answer in a tool call, and do NOT attempt to write it to a file — you have no tool that can write. Print the JSON and nothing else:

          {\"verdict\": \"blocker|should-fix|nit|clean\",
           \"summary\": \"one paragraph, plain English, what this PR does\",
           \"findings\": [{\"file\": \"repo/relative/path.go\", \"line\": 42, \"end_line\": 44, \"severity\": \"blocker|should-fix|nit\", \"title\": \"short label\", \"body\": \"what is wrong, why it matters, the concrete fix\"}]}

          For a change to Markdown or other prose, review it as documentation, not as Go: flag claims the code in this checkout contradicts, references to files, symbols or commands that no longer exist, and statements that contradict another part of the same document. Prose style, wording and formatting are 'nit' at most, and say nothing at all if the only issue is taste.

          Rules: 'line' must be a line that appears in ./pr.diff as added or context — never a line outside it. 'end_line' is optional and must be >= 'line'. Use severity 'nit' for anything that does not affect correctness. If you find nothing, emit verdict 'clean' with an empty findings array. Verify each finding against the code before asserting it; omit anything you cannot verify."

          # Try each free model in turn. A model that errors (rate limit,
          # free-tier refusal, rotated out of the catalog) must not fail the
          # review opaquely: its error text becomes a ::warning:: and the
          # next model is tried; only when every model fails is it an error.
          : > model-reply.txt
          for m in $MODELS; do
            echo "reviewing with ${m}"
            if opencode run --standalone --agent ghost-reviewer -m "$m" --format json \
                 "$REVIEW_PROMPT" > model-reply.try 2> model-stderr.txt \
               && [ -s model-reply.try ] \
               && ! jq -e 'select(.type == "error")' model-reply.try >/dev/null 2>&1; then
              mv model-reply.try model-reply.txt
              echo "review produced by ${m}"
              break
            fi
            reason=$( { jq -r 'select(.type == "error") | (.error.data.message // .error.message // .error.name // tostring)' model-reply.try 2>/dev/null; cat model-stderr.txt; } \
                      | tr -d '\r' | grep -v '^[[:space:]]*$' | head -c 400 | tr '\n' ' ')
            echo "::warning::review model ${m} failed: ${reason:-no output}"
          done
          rm -f model-reply.try

          [ -s model-reply.txt ] || { echo "::error::model produced no output at all"; exit 1; }
          echo "model reply: $(wc -c < model-reply.txt) bytes"
          # Event-type inventory. --format json emits JSONL, and the
          # answer lives in a message part, not at the top level; this
          # line names which part type carries it so a failed extraction
          # is diagnosable without another round trip. The tool name is
          # in there too: run 34878398658 failed with the answer inside a
          # tool part, and the log did not say which tool, which cost a
          # round trip. Indented, so a crafted type string cannot start
          # a '::' workflow command.
          jq -r '"\(.type)|\(.part.type // "-")|\(.part.tool // "-")"' model-reply.txt 2>/dev/null \
            | sort | uniq -c | sed 's/^/  /' || true

      - name: Mint bot identity token
        if: steps.context.outputs.skip != 'true'
        id: apptoken
        # Minted here, immediately before it's needed, rather than at job
        # start: this keeps the App token off disk for the entire time the
        # model step is running on attacker-controlled input.
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Warn on degraded identity
        if: ${{ steps.apptoken.outcome == 'failure' && steps.apptoken.outputs.token == '' }}
        run: echo "::warning::App token unavailable — reviews will post as github-actions"

      - name: Post review
        if: steps.context.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          python3 "${RUNNER_TEMP}/base-scripts/post_review.py" \
            "${GITHUB_REPOSITORY}" "${PR_NUMBER}" "$(cat pr.head)" \
            model-reply.txt pr.diff
