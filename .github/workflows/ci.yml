name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Rapid successive pushes replace the pending run instead of queueing
# duplicates behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# RUNNER IMAGE. Every job in .github/workflows/ names an EXPLICIT image rather
# than a floating `-latest` label, and the only exceptions are the non-required
# jobs that exist to try a candidate — the Linux pin is ubuntu-24.04.
# GitHub moves the `ubuntu-latest` label to Ubuntu 26 on 2026-10-19
# (actions/runner-images#14748), and that is not a cosmetic change here: a
# different toolchain, a different sqlite/libc, a different pwsh, and a
# different set of preinstalled tools that the release job's gh, the
# attestation tooling and this file's actionlint step all rely on. Every CI
# run and every release attestation to date was produced on 24.04, so the
# attested artifact of a known image is what is being protected.
#
# WINDOWS, same rule: the matrix names `windows-2025-vs2026`, which is the image
# `windows-latest` resolves to today (run 36772364289, "Image:
# windows-2025-vs2026"). Pinned to that name rather than to the OS version so
# that neither the Windows release nor the Visual Studio toolset can move under
# the matrix; `windows-11-arm` was already explicit. NO CANARY COVERS THIS ONE:
# ubuntu-26-canary runs no Windows step, so it can never be the evidence for
# moving this pin. A deliberate Windows bump is decided by pinning the candidate
# and reading the `Image:` line that run reports, which is how this pin was
# chosen.
#
# Bump the ubuntu pin deliberately, with the evidence below: `ubuntu-26-canary`
# runs build-and-test's own steps on ubuntu-26.04 and is NOT a required status
# check (main-branch-protection requires exactly build-and-test, lint and
# review-gate), so it can report a failure without blocking a merge or a
# release. Move the pin when that job is green, not when the label moves.
jobs:
  # Fast-feedback leg: everything that fails in seconds, in parallel with
  # build-and-test instead of ahead of it.
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # --new-from-rev=origin/main needs main's tip in the local history.
          fetch-depth: 0

      - name: actionlint
        # Workflow-file validity is not covered by golangci-lint. PR #421
        # shipped both an invalid `administration:` permissions key (which
        # makes Actions reject the whole file at parse time — 0 jobs, no
        # log) and a column-0 comment that broke YAML indentation. Both are
        # statically detectable; neither was caught before merge.
        #
        # Pinned release + SHA256, matching the repo's supply-chain
        # convention for third-party binaries.
        #
        # actionlint runs shellcheck over every run: block WHEN THE
        # SHELLCHECK BINARY IS PRESENT, and ubuntu-24.04 ships it. A local
        # run on a machine without shellcheck silently skips those checks
        # and is NOT equivalent to this job — the first real run of this
        # step failed on six findings a local pass had not surfaced.
        # Install shellcheck before trusting a local result. Pre-existing
        # findings are scoped per-file in .github/actionlint.yaml.
        run: |
          AL_VERSION=1.7.12
          AL_SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl --retry 3 --retry-connrefused -fsSL --proto '=https' --tlsv1.2 \
            -o /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/actionlint_${AL_VERSION}_linux_amd64.tar.gz"
          echo "${AL_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          # Count and scan the SAME set by construction. nullglob makes a
          # non-matching pattern expand to nothing instead of a literal, so
          # a repo with only .yml (like this one today) and one with .yaml
          # both work, and the guard below cannot disagree with what is
          # actually scanned.
          shopt -s nullglob
          FILES=(.github/workflows/*.yml .github/workflows/*.yaml)
          shopt -u nullglob
          # Explicit paths, not bare `actionlint`: this pins the scanned set
          # to .github/workflows/*.{yml,yaml} rather than relying on
          # actionlint's own project auto-discovery, and the count line below
          # is positive evidence of what was actually scanned.
          [ "${#FILES[@]}" -gt 0 ] || { echo "::error::actionlint found no workflow files to scan"; exit 1; }
          echo "actionlint scanning ${#FILES[@]} workflow file(s)"
          /tmp/actionlint -color "${FILES[@]}"

      - name: Review-script unit tests
        # stdlib-only unittest; ubuntu-24.04 ships python3, so no setup
        # step and no dependency install.
        #
        # unittest discover's own exit code is not a sufficient guard on its
        # own — whether zero tests collected counts as a failure has varied
        # across Python versions — so the "Ran N tests" line is asserted
        # explicitly here, the same way the actionlint step above guards its
        # own zero-files case with an explicit count. No `shell:` key is set
        # for this step, so it runs under the ubuntu runner's default
        # `bash -e {0}` — no pipefail — which is why output is captured via
        # command substitution instead of a pipe. (The Windows legs below
        # default to pwsh; their one `run:` line is shell-agnostic.)
        working-directory: .github/scripts
        run: |
          set +e
          OUTPUT=$(python3 -m unittest discover -p 'test_*.py' -v 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if ! grep -qE 'Ran [1-9][0-9]* test' <<<"$OUTPUT"; then
            echo "::error::unittest discover reported no tests ran — check for a renamed or missing test_*.py file"
            exit 1
          fi
          exit "$STATUS"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check gofmt
        # Whole-repo, every PR, no revision filter. This exists because
        # golangci-lint did NOT catch the unformatted test files that sat on
        # main (#842), and the two reasons it stayed silent are independent —
        # BOTH verified against the pinned v2.12.2, not inferred:
        #
        #   1. .golangci.yml has no `formatters:` section at all, so no
        #      formatter runs. `golangci-lint formatters` lists gofmt under
        #      "Disabled by your configuration formatters". In v2 gofmt is a
        #      FORMATTER, not a linter — adding it under `linters.enable`
        #      would not enable it.
        #   2. Even WITH gofmt enabled, this job's `run --new-from-rev=
        #      origin/main` reports "0 issues" for a file the PR does not
        #      touch. A whole-repo scan with the same config reports both
        #      files. So enabling the formatter alone would still let an
        #      untouched unformatted file through.
        #
        # Test files are NOT the gap: golangci's `run.tests` defaults to
        # true, and the whole-repo run flagged both _test.go files.
        #
        # `gofmt -l .` is not narrower than the tracked file set either — it
        # is BROADER. gofmt's directory walk does not stop at dot- or
        # underscore-prefixed directories (measured, not assumed: a probe
        # tree under ./.sandbox/hid with files in .sandbox/hid/.dot and
        # .sandbox/hid/_under was listed in full), so nothing hides in
        # .github/ and untracked scratch files are checked too, which is
        # what a gate should do. There is no vendor/ directory, so the walk
        # never reaches third-party code the repo does not control.
        #
        # The golangci-lint step is deliberately left exactly as it is: this
        # check is additive, so the only behaviour that changes is that
        # unformatted Go source now fails CI. The gate is `test -z` over
        # gofmt's own list, and the failure branch names the files, because
        # a bare non-zero exit is a poor thing to debug from a CI log.
        run: |
          UNFORMATTED="$(gofmt -l .)"
          test -z "$UNFORMATTED" || {
            echo "$UNFORMATTED"
            echo "::error::gofmt reports unformatted file(s) listed above — run 'gofmt -w .' and commit the result"
            exit 1
          }

      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned to the version verified locally against .golangci.yml —
          # 'latest' can break CI without a code change on a major bump.
          version: v2.12.2
          args: --new-from-rev=origin/main

      - name: Vulnerability scan
        # Pinned for the same reproducibility reason as golangci-lint above —
        # 'latest' can change scan behavior without a repository change.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  # The MCP-registry manifest (server.json) is release metadata, not Go code,
  # so nothing else in CI notices when it drifts — it sat at 0.15.0 while the
  # latest release was 0.29.0 for exactly that reason. This job pins its two
  # version fields to each other; release.yml additionally pins them to the
  # tag being released.
  manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate server.json
        run: |
          jq -e . server.json >/dev/null
          VERSION=$(jq -r '.version' server.json)
          IDENTIFIER=$(jq -r '.packages[0].identifier' server.json)
          # Bare semver only — the git tag carries the leading "v", the
          # manifest must not.
          if ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$VERSION"; then
            echo "::error::server.json version '$VERSION' is not bare semver (expected e.g. 0.29.0)"
            exit 1
          fi
          if [ "$IDENTIFIER" != "ghcr.io/wcatz/ghost:${VERSION}" ]; then
            echo "::error::server.json packages[0].identifier ('$IDENTIFIER') must be ghcr.io/wcatz/ghost:${VERSION}"
            exit 1
          fi
          echo "server.json consistent at ${VERSION}"

  # Heavy leg: race-instrumented compile dominates wall time, so it runs
  # concurrently with lint. The job name is a required branch-protection
  # context — do not rename casually.
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # -timeout 20m is DECLARED, not a raised limit: Go's implicit default is
      # 10m per test binary, and internal/memory's race binary sits at or past
      # it. Measured 2026-09-28 on feat/retention-tiers: 314s on a developer
      # laptop, 479.267s on one CI runner, and two runs on the same head that
      # hit the default and failed at 600.05s — the same tree, so the spread is
      # the runner, not the code. Nothing is weakened by declaring it: no
      # assertion changes, nothing is skipped, and the hang-prone tests keep
      # their own far tighter backstops (TestMultiProcessSharedDatabase's 90s
      # context, its 30s barrier waits, SQLite's busy timeouts), so this alarm
      # remains a deadlock net rather than the thing that finds one. Raise it
      # with a measurement beside it, never instead of one. The E2E step below
      # is left at the default on purpose: it measures ~67s.
      - name: Test
        run: go test -race -count=1 -timeout 20m ./...

      # The built-binary suite (e2e/, build tag e2e): every MCP tool, CLI
      # subcommand and hook against a sandboxed HOME with fake harnesses.
      # Without this step nothing ran it, so a change to a verdict format
      # could break it unseen.
      - name: E2E (built binary)
        run: go test -tags e2e -count=1 ./e2e/

      - name: Build
        run: go build -o /dev/null ./cmd/ghost

  # The canary for the runner bump everything else is pinned against: the same
  # three steps as build-and-test, on ubuntu-26.04, the image ubuntu-latest
  # migrates to on 2026-10-19. It exists so that bump is a decision made from
  # evidence instead of a date (see the RUNNER IMAGE note above).
  #
  # NOT A MATRIX LEG ON build-and-test, and that is not a style choice. GitHub
  # matches a required status check by the job's reported NAME, and a matrix
  # reports `build-and-test (ubuntu-24.04)`; `build-and-test` would then never be
  # reported, main-branch-protection would wait for a context that cannot arrive,
  # and every PR would sit at "Expected — waiting for status" with nothing to
  # clear it. A separate job keeps the required context's name intact and adds
  # one non-required check beside it.
  #
  # It cannot gate a merge or a release: main-branch-protection requires exactly
  # `build-and-test`, `lint` and `review-gate`, and this is none of them.
  #
  # And it deliberately does NOT use continue-on-error, so a real breakage on
  # 26.04 is a red X on a check nobody waits for, rather than a green tick over a
  # failed test — the same reasoning as plugin-validate.yml's "No
  # continue-on-error anywhere: if the design's gate cannot run, the run must be
  # red, not quietly green". A canary that cannot report red is not evidence.
  #
  # Its steps are copied from build-and-test rather than shared with it. A
  # reusable workflow or composite action would be one place to change both, but
  # it would also put a required job's steps behind an indirection whose
  # failure mode (a broken reference) takes the required check with it. A
  # duplicated step list is a cheaper risk than that.
  #
  # Deleting this job is how the pin is retired: when 26.04 is green and is the
  # image being attested, move the pin to it and drop the canary in the same
  # commit, so no run can be reported as evidence for the wrong image.
  ubuntu-26-canary:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The same -timeout 20m build-and-test declares, and for the same reason
      # (see its comment): internal/memory's race binary sits at or past Go's
      # implicit 10m default on a hosted runner. A canary must not fail for a
      # reason the leg it canaries also fails on, or its own verdict is noise.
      - name: Test
        run: go test -race -count=1 -timeout 20m ./...

      - name: E2E (built binary)
        run: go test -tags e2e -count=1 ./e2e/

      - name: Build
        run: go build -o /dev/null ./cmd/ghost

  # Real-Windows verification of the whole internal/mcpinit suite:
  # cross-platform correctness of every test in this package on native
  # Windows, both arches — the coupling test (runs the assemble scripts),
  # the plugin e2e suite (zip round-trip, MCP stdio handshake, both hooks,
  # init deferral), the hook tree-sync test, and the rest. Test isolation
  # sets USERPROFILE alongside HOME, so every test reads its hermetic
  # profile here. Two architectures because a native .exe cannot serve
  # both — matching the two per-arch marketplace entries.
  #
  # No -race: these are OS/ARCH legs — linux's build-and-test owns race.
  # If windows-11-arm cannot queue for this repo, trim the matrix to
  # windows-2025-vs2026.
  windows-plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: mcpinit package tests
        run: go test -count=1 ./internal/mcpinit/

      # The harness environment policy is part of the native runtime contract:
      # this exercises USERPROFILE/APPDATA and a real child process on Windows,
      # rather than relying only on a cross-compile.
      - name: ai package tests
        run: go test -count=1 ./internal/ai/

      # install.ps1 is a WINDOWS script, and its decision logic is checked by
      # running it — so this is the only job in the file that can. Both runners
      # ship PowerShell 7 as `pwsh` (and 5.1 as `powershell`), and the tests
      # need only 7 to execute; the 5.1 target is held separately, by the static
      # check in the same suite.
      #
      # `-run` rather than the whole package: the rest of internal/selfupdate
      # does not need a native Windows run, and the two jobs together already
      # cover it on linux. The point of adding this is the ONE thing no other job
      # could check — that the script's decisions agree with the Go client's on
      # the version boundary, and that it parses and runs on a Windows host.
      #
      # GHOST_REQUIRE_PWSH makes a missing pwsh a FAILURE rather than a skip. Two
      # of the four tests go through requirePwsh, and `go test` exits 0 when every
      # selected test SKIPS — so without this the step would stay green while
      # running nothing, the day a runner image stopped shipping PowerShell 7, and
      # the gap this step exists to close would reopen silently. Same concern as
      # the lint job's assertion on a literal `Ran [1-9][0-9]* test` line: zero
      # tests must not read as a pass.
      - name: install.ps1 decision tests
        env:
          GHOST_REQUIRE_PWSH: '1'
        run: go test -count=1 -run 'TestInstallPS1|^TestTheTwoBoundariesAgree$|^TestFirstAttestedVersionIsTheSameConstantInBoth$|^TestTheReleaseWorkflowIdentityIsTheSameStringInBoth$' ./internal/selfupdate/
