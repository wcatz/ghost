name: PR Agent

on:
  pull_request:
    # Re-review policy: every code push gets fresh bot eyes (synchronize);
    # docs-only pushes skip the trigger so they do not burn quota.
    # Trade-offs: a PR whose FIRST push is docs-only gets no automatic
    # review until a code-containing push fires synchronize (paths filters
    # apply to opened too) — request one via /review comment for that
    # case; likewise a docs-only follow-up push on an existing code PR
    # does not re-trigger. This job is informational — main's branch
    # protection requires build-and-test + lint only (no approval count,
    # no conversation resolution), so the bot reviews are a signal, never
    # a passing-merge gate.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

# Least privilege where it matters: the runner/app token with write scope
# is never available to the model step. All jobs carry the workflow-level
# pull-requests: write (posting needs it), but the model step gets NO
# GITHUB_TOKEN at all and the checkout used persist-credentials: false, so
# an injected instruction in the diff has no write-capable credential to
# reach. Nothing here writes issues.
permissions:
  contents: read
  pull-requests: write

# One agent run per trigger per PR at a time. The GROUP is computed from
# the event and, for issue_comment, from the comment BODY and author —
# because WORKFLOW-LEVEL concurrency is entered when a run is created,
# BEFORE any job `if:` is evaluated, every issue_comment triggers a run
# that lands in some group. So non-command comments must not share a key
# with in-flight /review runs: they get a throwaway 'noop' group (their
# run ends in ~1s when the config job skips) and so can never cancel a
# human-triggered review. The manual-lane predicate mirrors the config
# job's /review gate EXACTLY (same body forms, same trusted-authors list,
# same bot-sender filter): a drive-by comment like '/review:' or '/review?'
# — even from a NONE-association or Bot sender — falls through to 'noop',
# not 'manual', so it can never kill a collaborator's in-flight review.
# Lane separation does double duty:
#   - A push (pull_request -> 'auto') never cancels a /review run
#     (issue_comment -> 'manual' or 'noop'), and vice versa.
#   - cancel-in-progress is then safe: a newer push cancels only a stale
#     auto run; a second genuine /review cancels only an older /review.
# The bot's own posts emit pull_request_review (unsubscribed) and its
# comment sender is filtered as a Bot, so it never re-triggers either lane.
concurrency:
  group: >-
    pr-agent-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number }}-${{ (github.event_name == 'issue_comment' && github.event.sender.type != 'Bot' && contains('OWNER MEMBER COLLABORATOR', github.event.comment.author_association) && (github.event.comment.body == '/review' || startsWith(github.event.comment.body, '/review ') || startsWith(github.event.comment.body, '/review –') || startsWith(github.event.comment.body, '/review —')) && 'manual') || (github.event_name == 'pull_request' && 'auto') || 'noop' }}
  cancel-in-progress: true

jobs:
  config:
    # Same-repo / trust resolution before the review job is allowed to run:
    # - issue_comment fires on fork-PR comments in the base repo, so a PR's
    #   head repo must be checked via the API.
    # - Plain-issue comments have no PR for the reviewer to act on — skip
    #   rather than spinning up a no-op review run.
    # - The issue_comment lane acts only on a "/review" command comment
    #   (the old PR-Agent gesture). Everyday maintenance comments ("lgtm",
    #   "thanks", "🎉") must NOT burn a free-tier run or post an
    #   unsolicited duplicate review.
    # Comment commands are limited to trusted authors so drive-by comments on
    # this public repo cannot burn runner time.
    if: >-
      github.event.sender.type != 'Bot' && (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'issue_comment' &&
          (github.event.comment.body == '/review' ||
           startsWith(github.event.comment.body, '/review –') ||
           startsWith(github.event.comment.body, '/review —') ||
           startsWith(github.event.comment.body, '/review ')) &&
          contains('OWNER MEMBER COLLABORATOR', github.event.comment.author_association)
        )
      )
    runs-on: ubuntu-latest
    outputs:
      same-repo: ${{ steps.pr.outputs.same-repo }}
      pr-number: ${{ steps.pr.outputs.pr-number }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_pr="$(jq -r '(.pull_request != null) or (.issue.pull_request != null)' "$GITHUB_EVENT_PATH")"
          if [ "$is_pr" != "true" ]; then
            echo "same-repo=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NUMBER="$(jq -r '.pull_request.number // .issue.number' "$GITHUB_EVENT_PATH")"
          echo "pr-number=$NUMBER" >> "$GITHUB_OUTPUT"
          head_repo="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq '.head.repo.full_name')"
          if [ "$head_repo" = "$GITHUB_REPOSITORY" ]; then
            echo "same-repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "same-repo=false" >> "$GITHUB_OUTPUT"
            # A trusted author's /review on a fork PR silently no-ops via the
            # review job's same-repo gate. Say so instead of leaving the
            # requester with a green-but-doing-nothing run: the review job
            # deliberately never runs on fork heads (they are not covered by
            # the arrival security posture), so make the non-action explicit.
            # Posted as a pr REVIEW comment, not an issues/{n}/comments call:
            # this workflow holds contents: read + pull-requests: write, and
            # the issues endpoint needs issues: write (a 403 would otherwise
            # be swallowed silently by the redirect to stderr).
            if [ "$GITHUB_EVENT_NAME" = "issue_comment" ]; then
              gh pr review "$NUMBER" --comment \
                --body "Review skipped: this PR's head is in $head_repo (a fork). Reviews only run on same-repository PRs." \
                || echo "::warning::could not post fork-skip notice (permissions or transient API failure)"
            fi
          fi

  review:
    needs: config
    if: needs.config.outputs.same-repo == 'true'
    runs-on: ubuntu-latest
    # Hard cap: a hung model call or huge diff must die at the runner, not
    # park it for 10 minutes. 20m covers the 10m model budget plus install,
    # checkout, prep, and a posting retry with headroom, while still
    # bounding a pathological hang.
    timeout-minutes: 20
    steps:
      - name: Mint bot identity token
        id: apptoken
        # Reviews post as the Review Loop GitHub App instead of
        # github-actions. Falls back to the runner token when the App
        # secrets are absent — functionality intact, identity degrades.
        if: ${{ vars.USE_BOT_IDENTITY != 'false' }}
        continue-on-error: true
        # SHA-pinned: the repo's stated supply-chain convention, and the
        # only place hash-pinning is free to do (the installer, below, is
        # tag-pinned curl|bash by deliberate trade-off).
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id (not app-id): v3 deprecates app-id input
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Warn on degraded identity
        # The mint step above swallows its own failure (continue-on-error);
        # surface the degradation loudly or debugging "why is the bot
        # github-actions?" means spelunking step logs.
        if: ${{ steps.apptoken.outputs.token == '' }}
        run: echo "::warning::App token unavailable — reviews will post as github-actions"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Single-depth: `gh pr diff` is API-backed (GET pulls/{n} with the
          # .diff media type), so no local history is needed; the model only
          # reads the checked-out head tree after `gh pr checkout`.
          fetch-depth: 1
          # Do NOT persist the token into .git/config (the default). The
          # model step below must not be able to reach ANY write-scoped
          # credential — not via env, not via the checkout's http.extraheader.
          # gh pr checkout/view in the Prepare step authenticates with the
          # GH_TOKEN passed explicitly to that step alone.
          persist-credentials: false

      # No API key anywhere: big-pickle rides the opencode free tier, which
      # only works through the CLI process (the /zen REST endpoint rejects
      # it with "OpenCode's free tier can only be used in OpenCode").
      # GITHUB_TOKEN below is used only to fetch the PR and post the review.
      - name: Install opencode
        # Supply-chain trade-off, stated deliberately: the opencode CLI has
        # no SHA pin, but its installer supports `-v <version>` — pin the
        # tested release (the version of the first green CI run) instead of
        # silently tracking latest. Revisit if opencode ships checksums.
        run: curl -fsSL --proto '=https' --tlsv1.2 https://opencode.ai/install | bash -s -- -v 1.18.30

      - name: Prepare review context
        # Checkout the PR head and capture the diff BEFORE the model gets
        # any tool access, so the write-scoped token never coexists in the
        # same env as an untrusted-input-fed agent. The model step below
        # has no GH_TOKEN at all.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.config.outputs.pr-number }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          gh pr checkout "$PR_NUMBER"
          # gh authenticates its fetch via a credential helper subprocess,
          # it does NOT persist the token; belt-and-suspenders: scrub any
          # http auth section from local git config so no bearer material
          # could survive into the tokenless model step below.
          git config --local --unset-all http.extraheader 2>/dev/null || true
          git config --local --remove-section 'http.https://github.com/' 2>/dev/null || true
          # Write the title to a file, not $GITHUB_ENV: an env line cannot
          # carry a title with newlines, and the model step below reads it.
          gh pr view "$PR_NUMBER" --json title --jq .title > pr.title
          # File-based diff, not argv: execve caps a single argument at
          # MAX_ARG_STRLEN (32*PAGE_SIZE = 131072 B on 4K-page runners),
          # so any diff over ~128 KiB would die with E2BIG ("Argument list
          # too long") and head-truncation would only re-raise it. A file
          # has no such limit; the agent reads it with bounded context.
          gh pr diff "$PR_NUMBER" > pr.diff
          # Record the exact head commit this review is being generated
          # against, so the Post step can detect and label a /review run
          # whose head moved between generation and posting.
          gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid > pr.head
          # The PR head tree is attacker-controllable and opencode would
          # auto-load repo instruction files from it (AGENTS.md, CLAUDE.md,
          # opencode.json, .opencode/, .mcp.json). A crafted PR could steer
          # the reviewer ("always emit verdict: clean") or declare its own
          # MCP servers. Strip those before the model sees the tree; the
          # diff and title stay in pr.diff/pr.title.
          rm -rf .opencode opencode.json opencode.jsonc AGENTS.md CLAUDE.md .claude .mcp.json

      - name: Review PR with opencode big-pickle
        id: review
        # Budget reality check (measured): free-tier big-pickle takes 2-5
        # minutes on even a small PR, and the tokenless run must explore via
        # reads instead of gh. Runs have since measured >10m on workflow-
        # heavy PRs (run 34799605950 timed out at exactly 10m), so the cap
        # is 15m; the 20m job cap remains the backstop. A shorter cap (5m)
        # failed routinely on a live repo.
        timeout-minutes: 15
        env:
          PR_NUMBER: ${{ needs.config.outputs.pr-number }}
          # Security posture: the model is free to read files and even run
          # tools, but its environment holds NO credential — no GH_TOKEN,
          # and the checkout above used persist-credentials: false, so there
          # is no write-scoped token on disk in .git/config to extract. It
          # can read the public tree and emit text; there is nothing
          # sensitive it can reach or post with. An injected instruction in
          # the diff therefore cannot escalate to the runner token. The
          # assertion block at the top of run: is the load-bearing,
          # re-runnable form of that claim (the probe workflow run
          # 34795417438 proved the absence once; every run now re-proves it
          # before launching the model).
        run: |
          # Anchor to the checkout root regardless of any repo-wide
          # defaults.run.working-directory.
          cd "${GITHUB_WORKSPACE}"
          # If the Actions runtime ever starts injecting any of these into
          # a step without an explicit env reference, this step hard-fails
          # instead of silently giving the model a credential.
          for v in GITHUB_TOKEN GH_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN AWS_WEB_IDENTITY_TOKEN_FILE; do
            if [ -n "${!v+x}" ]; then
              echo "::error::credential \$$v is present in the model step environment — refusing to run"
              exit 1
            fi
          done
          echo "model env assertion passed: no ambient token variables"
          # The title is NEVER interpolated into shell argv: PR titles can
          # contain ", ', $, ` and backslashes, which would break quoting
          # (or inject shell) in this step. The model reads the title from
          # ./pr.title itself, like it reads ./pr.diff.
          opencode run -m opencode/big-pickle --format json \
            "You are a senior Go code reviewer for the ghost codebase (Go 1.26+, modernc.org/sqlite, no CGO). Review PR #${PR_NUMBER}. The PR title is in ./pr.title — read it. The diff is in ./pr.diff — read it; it is authoritative for the changed lines, do NOT re-derive it from git history or git commands. Read the actual changed files in this checkout to verify findings. Do NOT run commands, do NOT propose verification steps, and do NOT narrate your process — produce the analysis immediately. Cover: correctness bugs, race conditions, error handling gaps, and breaking changes to MCP tool contracts or the SQLite schema. Do NOT report style preferences — golangci-lint handles those. Verify each finding against the code before asserting — if unsure, say \"needs verification\" rather than asserting a bug. The FIRST line of your reply MUST be exactly \"verdict: <blocker|should-fix|nit|clean>\", on its own line — this exact token is consumed programmatically, so do not bold or decorate it. Then a numbered list of findings ordered by severity, each with file:line, what is wrong, why it matters, and a concrete fix." \
            > events.jsonl
          # A non-zero exit fails the step (bash -e) with stderr surfaced in
          # the live log; the extraction step below turns silence into a
          # loud "no review text" error.

      - name: Extract and gate review
        run: |
          cd "${GITHUB_WORKSPACE}"
          # The model's final answer is the LAST non-blank text event.
          # Whitespace-only parts ('\n\n' step paddings) are skipped so they
          # cannot win the top slot and trip the verdict gate on a good
          # review. GitHub caps review bodies at ~64 KiB of UTF-8 BYTES:
          # slicing jq by code points is wrong for a rune-dense review (60000
          # CJK/em-dash runes ≈ 240 KB → gh pr review 422s, run silently
          # lost). Trim to 60000 bytes, dropping only a trailing partial
          # rune so review.md is always valid UTF-8 and always under the cap.
          python3 -c 'import json; parts = [e["part"]["text"] for e in (json.loads(l) for l in open("events.jsonl") if l.strip().startswith("{")) if e.get("type") == "text" and isinstance((e.get("part") or {}).get("text"), str) and e["part"]["text"].strip()]; a = parts[-1] if parts else ""; b = a.encode("utf-8")[:60000].decode("utf-8", "ignore"); b += "\n\n_[truncated by CI — full review exceeds GitHub'"'"'s 64 KiB body cap]_" if len(a.encode("utf-8")) > 60000 else ""; open("review.md.tmp", "w").write(b); print("truncated" if len(a.encode("utf-8")) > 60000 else "ok")'
          if [ ! -s review.md.tmp ]; then
            echo "::error::opencode produced no review text"
            cat events.jsonl
            exit 1
          fi
          mv review.md.tmp review.md
          # The verdict token must be the FIRST non-blank line — a review
          # that opens with narrative and buries the verdict is a contract
          # break. Triage: strict first-line pass → post clean. Verdict
          # token present anywhere (wrapped/prefixed) → post with a
          # warning — a good review that wobbled on line 1 is never
          # dropped. No verdict token at all → HARD FAIL and dump the body
          # to logs instead of posting: an unclassifiable body must not
          # appear as the bot's authoritative review comment.
          first_nonblank="$(grep -m1 -vE '^[[:space:]]*$' review.md || true)"
          strict="$(printf '%s' "$first_nonblank" | grep -qiE '^\*{0,2}[[:space:]]*verdict:[[:space:]]+(blocker|should-fix|nit|clean)' && echo yes || echo no)"
          # Loose match tolerates wrappers ("verdict: clean", 'verdict = clean',
          # a stray code fence) so a good review is recognized as such. The
          # separator is OPTIONAL (:,-,=, or bare space) — a wobbled "verdict
          # clean" must fall to the warning path, never the hard-fail drop.
          loose="$(grep -oiE 'verdict[[:space:]]*[:=-]?[[:space:]]*(blocker|should-fix|nit|clean)' review.md | head -1 || true)"
          if [ "$strict" = "yes" ]; then
            echo "verdict gate: strict pass"
          elif [ -n "$loose" ]; then
            echo "::warning::verdict present but not on the first line — posting"
          else
            echo "::error::no verdict token in review body — refusing to post an unclassifiable body"
            cat review.md
            exit 1
          fi
          echo "wrote $(wc -c < review.md) bytes"

      - name: Post review
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token || github.token }}
          PR_NUMBER: ${{ needs.config.outputs.pr-number }}
        run: |
          cd "${GITHUB_WORKSPACE}"
          reviewed="$(cat pr.head 2>/dev/null || true)"
          # Dedup helper: does any existing review body carry a marker for
          # this head? The posted body embeds <!-- bot-review:<sha> -->, and
          # concurrency lanes are split by event type, so an in-flight
          # synchronize auto-run plus a /review, or a re-typed /review on the
          # same head, would otherwise double-post. Identity-agnostic: works
          # for App or github-actions authorship.
          # Exit contract (deliberate, used below): 0 = marker found, 1 =
          # definitively not posted, 2 = UNKNOWN (listing failed or no head
          # recorded). gh runs alone first (no pipe), so a transient gh
          # failure returns 2 — it is NOT masked as jq's "no match" (which
          # would read as 1 and wrongly re-post). gh api --paginate also
          # concatenates each page's top-level array ('[{..}][{..}]'), which
          # is not a single JSON document, so jq flattens with 'add' before
          # matching. Only the two known states are returned; anything else
          # (e.g. jq parse error on corrupt input) is surfaced loudly by the
          # caller instead of being quietly treated as "not posted".
          already_posted() {
            [ -n "$reviewed" ] || return 2
            local body
            if ! body="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --paginate)"; then
              return 2
            fi
            local rc=0
            # -s slurp: gh api --paginate may emit one array OR (multi-page)
            # several concatenated arrays; slurping flattens every page into
            # one outer array, then 'add' concatenates them into a single
            # reviews array before matching. (Plain 'add' on an array of
            # OBJECTS would keywise-merge them, and a subsequent .[] would
            # then iterate mixed-typed merged values — .body on an id
            # number, exactly the rc=5 seen on run 34800256653.)
            jq -e -s --arg s "$reviewed" \
              'add | any(.[]; (.body // "") | contains("<!-- bot-review:" + $s + " -->"))' \
              <<<"$body" >/dev/null || rc=$?
            [ "$rc" = 0 ] && return 0
            [ "$rc" = 1 ] && return 1
            echo "::error::already_posted: jq failed unexpectedly (rc=$rc) on the reviews payload — aborting to avoid a duplicate or lost review"
            exit 1
          }
          # Compare the reviewed head against the PR's CURRENT head. A /review
          # run that started at head X takes minutes of model time, so a push
          # to Y can land in between; a pull_request run is already gated to
          # the live head by its synchronize trigger. Label the stale case
          # rather than silently posting line numbers for a dead head. The
          # fetch is best-effort (|| true): a transient API failure or a PR
          # already closed after the model finished must NOT abort the post
          # of an otherwise-finished review — an empty 'current' just skips
          # the staleness label.
          current="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid 2>/dev/null || true)"
          if [ -n "$reviewed" ] && [ -n "$current" ] && [ "$current" != "$reviewed" ]; then
            echo "" >> review.md
            echo "_note: PR head moved to ${current:0:7} since this review was generated against ${reviewed:0:7} — line numbers may be stale._" >> review.md
          fi
          rc=0
          already_posted || rc=$?
          if [ "$rc" = 0 ]; then
            echo "skip: self-review already posted for head ${reviewed:0:7}"
            exit 0
          fi
          # UNKNOWN at the pre-post check fails OPEN toward delivery (post):
          # an otherwise-finished review must not be lost to a transient
          # listing failure — a rare duplicate comment is cosmetic, a lost
          # review is not. The retry path below, where a duplicate would
          # actually be created, is the one that fails closed. Say so
          # instead of being silent.
          [ "$rc" = 2 ] && echo "::warning::could not verify prior reviews (review listing error); posting anyway — delivery over dedup"
          # Brand the body so a later same-head run (or our own retry) can
          # self-dedup.
          printf '\n<!-- bot-review:%s -->\n' "$reviewed" >> review.md
          post_review() {
            gh pr review "$PR_NUMBER" --comment --body-file review.md
          }
          # Retry exactly once on a transient network/API failure so a flake
          # cannot silently destroy a finished review. Re-check the marker
          # before retrying: if the first call actually committed server-side
          # but gh failed on the response (drop/timeout), review.md is now a
          # duplicate — a marker present means the first post landed, so the
          # retry must be skipped, not repeated. A persistent failure still
          # surfaces as a red step.
          if ! post_review; then
            sleep 15
            rc=0
            already_posted || rc=$?
            case "$rc" in
              0) echo "first post committed despite client error — not re-posting" ;;
              1) post_review || exit 1 ;;
              2) echo "::error::retry aborted: could not verify whether the first post landed (review listing failed); not re-posting to avoid a duplicate. Re-run the pipeline to finish this review."
                 exit 1 ;;
              *) echo "::error::already_posted returned unexpected status $rc — aborting retry explicitly"
                 exit 1 ;;
            esac
          fi
