name: PR Agent

on:
  pull_request:
    # review_requested (not synchronize): a fresh review per push burns Go
    # quota every commit, and the original plan ("Re-review policy: NOT on
    # synchronize; manual /review instead") still holds — pr_agent_job is
    # not a required branch-protection context (workflow_run-triggered
    # workflows attach to the wrong SHA for that; see pr-loop.yml), so a
    # stale context on a new head SHA cannot block merge.
    types: [opened, reopened, ready_for_review, review_requested]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

# One agent run per PR at a time: a duplicate trigger (e.g. the same /review
# comment delivered twice by a client retry) replaces the in-flight run
# instead of racing it and burning double quota.
concurrency:
  group: pr-agent-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  config:
    # Same-repo / trust resolution before the agent job (which holds
    # OPENCODE_GO_API_KEY) is allowed to run:
    # - issue_comment fires on fork-PR comments in the base repo, so a PR's
    #   head repo must be checked via the API.
    # - Plain-issue comments have no PR for PR-Agent to act on — skip rather
    #   than spinning up a no-op agent run.
    # Comment commands are limited to trusted authors so drive-by comments on
    # this public repo cannot burn subscription quota; PR authors here are
    # always OWNER/MEMBER/COLLABORATOR.
    if: >-
      github.event.sender.type != 'Bot' && (
        github.event_name == 'pull_request' ||
        contains('OWNER MEMBER COLLABORATOR', github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    outputs:
      same-repo: ${{ steps.pr.outputs.same-repo }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_pr="$(jq -r '(.pull_request != null) or (.issue.pull_request != null)' "$GITHUB_EVENT_PATH")"
          if [ "$is_pr" != "true" ]; then
            echo "same-repo=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NUMBER="$(jq -r '.pull_request.number // .issue.number' "$GITHUB_EVENT_PATH")"
          head_repo="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq '.head.repo.full_name')"
          if [ "$head_repo" = "$GITHUB_REPOSITORY" ]; then
            echo "same-repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "same-repo=false" >> "$GITHUB_OUTPUT"
          fi

  pr_agent_job:
    needs: config
    if: needs.config.outputs.same-repo == 'true'
    runs-on: ubuntu-latest
    # Hard cap: litellm's ai_timeout does not bound a hung streamed call —
    # observed 651s before the upstream 500 came back. Kill at the runner.
    # 90s per LLM call x several sequential calls can legitimately exceed
    # 8 minutes (a full review died at exactly 8m24s), so allow 10.
    timeout-minutes: 10
    steps:
      - name: PR Agent action step
        id: pragent
        # Pinned to a commit SHA (not a mutable tag) for supply-chain
        # hardening — matches repo convention of pinning tool versions.
        uses: the-pr-agent/pr-agent@4ebd5c5333c6ef21509e7304d27969eb825e6f22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Big Pickle via opencode Zen — free stealth reasoning model
          # (opencode's deliberate-analysis model), chosen for review
          # quality and to dodge the Go endpoint's recurring hang days.
          OPENAI__KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
          OPENAI__API_BASE: https://opencode.ai/zen/v1

          # openai/ prefix routes through litellm's OpenAI-compatible path.
          config.model: "openai/big-pickle"
          # Fallback rides a different provider lane (DeepSeek) on the same
          # Zen endpoint so an unhealthy pickle host doesn't fail the run.
          config.fallback_models: '["openai/deepseek-v4-flash"]'
          # Not in PR-Agent's MAX_TOKENS catalog → must set explicitly.
          config.custom_model_max_tokens: "65536"
          # No temperature override: 1 was a Kimi-Go quirk; PR-Agent's
          # default 0.2 keeps reviews deterministic.
          # Hard cap per LLM call — a hung endpoint must fail fast, not
          # park the runner for 10 minutes.
          config.ai_timeout: "90"

          # Reviewer scope: bugs and real regressions, not style nits.
          pr_reviewer.extra_instructions: >-
            This is a Go CLI project (Go 1.26+, modernc.org/sqlite, no CGO).
            Focus on correctness bugs, race conditions, error handling gaps,
            and breaking changes to MCP tool contracts or the SQLite schema.
            Do not report style preferences handled by golangci-lint.

          github_action_config.auto_review: "true"
          # On-demand only (/improve comment): per-finding suggestion
          # generation is sequential LLM calls and blew the 10-min runner
          # cap three runs straight when always-on. Also, do NOT auto-commit
          # to PR branches — that needs pull-requests: write and surprises
          # authors.
          github_action_config.auto_improve: "false"
          # Off: the generated walkthrough summaries are verbose LLM slop
          # and have hallucinated project-specific names. Findings live in
          # the review + inline threads; no description is posted.
          github_action_config.auto_describe: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "review_requested"]'
