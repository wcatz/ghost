name: PR Agent

on:
  pull_request:
    # Re-review policy: every code push gets fresh bot eyes (synchronize);
    # docs-only pushes skip the trigger so they do not burn quota.
    # Trade-offs: a PR whose FIRST push is docs-only gets no automatic
    # review until a code-containing push fires synchronize (paths filters
    # apply to opened too) — request one via /review comment for that
    # case; likewise a docs-only follow-up push on an existing code PR
    # does not re-trigger. This job is informational — main's branch
    # protection requires build-and-test + lint only (no approval count,
    # no conversation resolution), so the bot reviews are a signal, never
    # a passing-merge gate.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
    types: [opened, reopened, ready_for_review, review_requested, synchronize]
  issue_comment:
    types: [created]

# Least privilege: the model step has NO scoped token (see job below),
# and nothing here writes issues — only the final post needs pull-request
# write, which is granted via the app token passed to that single step.
permissions:
  contents: read
  pull-requests: write

# One agent run per trigger per PR at a time. Key separately on
# github.event_name: a human-triggered /review comment (issue_comment)
# must NOT cancel an in-flight pull_request auto-review between model
# completion and post, or the freshest review silently disappears. The
# bot's own posts emit pull_request_review (unsubscribed) and its comment
# sender is filtered as a Bot, so it never re-triggers either lane.
concurrency:
  group: pr-agent-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  config:
    # Same-repo / trust resolution before the review job is allowed to run:
    # - issue_comment fires on fork-PR comments in the base repo, so a PR's
    #   head repo must be checked via the API.
    # - Plain-issue comments have no PR for the reviewer to act on — skip
    #   rather than spinning up a no-op review run.
    # Comment commands are limited to trusted authors so drive-by comments on
    # this public repo cannot burn runner time.
    if: >-
      github.event.sender.type != 'Bot' && (
        github.event_name == 'pull_request' ||
        contains('OWNER MEMBER COLLABORATOR', github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    outputs:
      same-repo: ${{ steps.pr.outputs.same-repo }}
      pr-number: ${{ steps.pr.outputs.pr-number }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_pr="$(jq -r '(.pull_request != null) or (.issue.pull_request != null)' "$GITHUB_EVENT_PATH")"
          if [ "$is_pr" != "true" ]; then
            echo "same-repo=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NUMBER="$(jq -r '.pull_request.number // .issue.number' "$GITHUB_EVENT_PATH")"
          echo "pr-number=$NUMBER" >> "$GITHUB_OUTPUT"
          head_repo="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq '.head.repo.full_name')"
          if [ "$head_repo" = "$GITHUB_REPOSITORY" ]; then
            echo "same-repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "same-repo=false" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: config
    if: needs.config.outputs.same-repo == 'true'
    runs-on: ubuntu-latest
    # Hard cap: a hung model call or huge diff must die at the runner, not
    # park it for 10 minutes. 15m covers checkout + install + review with
    # headroom while still bounding a pathological hang.
    timeout-minutes: 15
    steps:
      - name: Mint bot identity token
        id: apptoken
        # Reviews post as the Review Loop GitHub App instead of
        # github-actions. Falls back to the runner token when the App
        # secrets are absent — functionality intact, identity degrades.
        if: ${{ vars.USE_BOT_IDENTITY != 'false' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v3.2.0
        with:
          # client-id (not app-id): v3 deprecates app-id input
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Warn on degraded identity
        # The mint step above swallows its own failure (continue-on-error);
        # surface the degradation loudly or debugging "why is the bot
        # github-actions?" means spelunking step logs.
        if: ${{ steps.apptoken.outputs.token == '' }}
        run: echo "::warning::App token unavailable — reviews will post as github-actions"

      - uses: actions/checkout@v6
        with:
          # Single-depth: `gh pr diff` is API-backed (GET pulls/{n} with the
          # .diff media type), so no local history is needed; the model only
          # reads the checked-out head tree after `gh pr checkout`.
          fetch-depth: 1
          # Do NOT persist the token into .git/config (the default). The
          # model step below must not be able to reach ANY write-scoped
          # credential — not via env, not via the checkout's http.extraheader.
          # gh pr checkout/view in the Prepare step authenticates with the
          # GH_TOKEN passed explicitly to that step alone.
          persist-credentials: false

      # No API key anywhere: big-pickle rides the opencode free tier, which
      # only works through the CLI process (the /zen REST endpoint rejects
      # it with "OpenCode's free tier can only be used in OpenCode").
      # GITHUB_TOKEN below is used only to fetch the PR and post the review.
      - name: Install opencode
        # Supply-chain trade-off, stated deliberately: the opencode CLI has
        # no SHA pin, but its installer supports `-v <version>` — pin the
        # tested release (the version of the first green CI run) instead of
        # silently tracking latest. Revisit if opencode ships checksums.
        run: curl -fsSL https://opencode.ai/install | bash -s -- -v 1.18.30

      - name: Prepare review context
        # Checkout the PR head and capture the diff BEFORE the model gets
        # any tool access, so the write-scoped token never coexists in the
        # same env as an untrusted-input-fed agent. The model step below
        # has no GH_TOKEN at all.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.config.outputs.pr-number }}
        run: |
          gh pr checkout "$PR_NUMBER"
          # Write the title to a file, not $GITHUB_ENV: an env line cannot
          # carry a title with newlines, and the model step below reads it.
          gh pr view "$PR_NUMBER" --json title --jq .title > pr.title
          # File-based diff, not argv: execve caps a single argument at
          # MAX_ARG_STRLEN (32*PAGE_SIZE = 131072 B on 4K-page runners),
          # so any diff over ~128 KiB would die with E2BIG ("Argument list
          # too long") and head-truncation would only re-raise it. A file
          # has no such limit; the agent reads it with bounded context.
          gh pr diff "$PR_NUMBER" > pr.diff

      - name: Review PR with opencode big-pickle
        id: review
        # Budget reality check (measured): free-tier big-pickle takes 2-5
        # minutes on even a small PR, and the tokenless run must explore via
        # reads instead of gh. 10m is the observed worst case with headroom;
        # the 15m job cap remains the backstop. A shorter cap (5m) failed
        # routinely on a live repo.
        timeout-minutes: 10
        env:
          PR_NUMBER: ${{ needs.config.outputs.pr-number }}
          # Security posture: the model is free to read files and even run
          # tools, but its environment holds NO credential — no GH_TOKEN,
          # and the checkout above used persist-credentials: false, so there
          # is no write-scoped token on disk in .git/config to extract. It
          # can read the public tree and emit text; there is nothing
          # sensitive it can reach or post with. An injected instruction in
          # the diff therefore cannot escalate to the runner token.
        run: |
          # JSON event stream, not raw stdout: the formatted TUI emits tool
          # trace lines ("→ Read x", "> build") to stdout that would land in
          # review.md and break the first-line verdict contract. The last
          # text event's part.text is the model's final answer only.
          PR_TITLE="$(cat pr.title)"
          opencode run -m opencode/big-pickle --format json \
            "You are a senior Go code reviewer for the ghost codebase (Go 1.26+, modernc.org/sqlite, no CGO). Review PR #${PR_NUMBER} \"${PR_TITLE}\". The diff is in ./pr.diff — read it; it is authoritative for the changed lines, do NOT re-derive it from git history or git commands. Read the actual changed files in this checkout to verify findings. Do NOT run commands, do NOT propose verification steps, and do NOT narrate your process — produce the analysis immediately. Cover: correctness bugs, race conditions, error handling gaps, and breaking changes to MCP tool contracts or the SQLite schema. Do NOT report style preferences — golangci-lint handles those. Verify each finding against the code before asserting — if unsure, say \"needs verification\" rather than asserting a bug. The FIRST line of your reply MUST be exactly \"verdict: <blocker|should-fix|nit|clean>\", on its own line — this exact token is consumed programmatically, so do not bold or decorate it. Then a numbered list of findings ordered by severity, each with file:line, what is wrong, why it matters, and a concrete fix." \
            > events.jsonl
          # A non-zero exit fails the step (bash -e) with stderr surfaced in
          # the live log; the extraction step below turns silence into a
          # loud "no review text" error.

      - name: Extract and gate review
        run: |
          # The model's final answer is the LAST non-blank text event.
          # Whitespace-only parts ('\n\n' step paddings) are skipped so they
          # cannot win the top slot and trip the verdict gate on a good
          # review. Slice to 60000 code points (not bytes) so a rune never
          # splits before GitHub's ~64 KiB review-body limit.
          jq -rs '[.[] | select(.type == "text") | .part.text? | select(type == "string") | select(test("[^[:space:]]"))] | last // "" | .[0:60000]' events.jsonl > review.md.tmp
          if [ ! -s review.md.tmp ]; then
            echo "::error::opencode produced no review text"
            cat events.jsonl
            exit 1
          fi
          mv review.md.tmp review.md
          # The verdict token must be the FIRST non-blank line — a review
          # that opens with narrative and buries the verdict is a contract
          # break, not a judgement call.
          first_nonblank="$(grep -m1 -vE '^[[:space:]]*$' review.md || true)"
          if ! printf '%s' "$first_nonblank" | grep -qiE '^\*{0,2}[[:space:]]*verdict:[[:space:]]+(blocker|should-fix|nit|clean)'; then
            echo "::error::opencode review missing a verdict token on the first line"
            cat review.md
            exit 1
          fi
          echo "wrote $(wc -c < review.md) bytes"

      - name: Post review
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token || github.token }}
          PR_NUMBER: ${{ needs.config.outputs.pr-number }}
        run: gh pr review "$PR_NUMBER" --comment --body-file review.md
