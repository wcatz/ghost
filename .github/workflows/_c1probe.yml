name: c1-probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe main write protection (wrong-sha PUT cannot commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.claude-plugin/marketplace.json?ref=main" --jq .sha)"
          echo "read ok; current marketplace.json blob sha on main=${SHA}"
          RESP_FILE="$(mktemp)"
          set +e
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/.claude-plugin/marketplace.json" \
            -f message="c1 probe (wrong sha cannot commit)" \
            -f content="$(printf '{}' | base64 -w0)" \
            -f sha="0000000000000000000000000000000000000000" \
            -f branch=main >"$RESP_FILE" 2>&1
          RC=$?
          set -e
          echo "--- raw PUT response (rc=${RC}) ---"
          cat "$RESP_FILE"
          echo "--- end raw PUT response ---"
          if grep -qiE "pull request|protected branch|not allowed to push" "$RESP_FILE"; then
            echo "::error::main write protection still applies to GITHUB_TOKEN — C1 fix NOT working"
            exit 1
          fi
          if grep -qiE "resource not accessible|bad credentials|requires authentication|write access to repository" "$RESP_FILE"; then
            echo "::error::ambiguous permission failure — bypass NOT proven (token could not attempt the write)"
            exit 1
          fi
          echo "probe rc=${RC} — response is not a protection rejection; bypass effective (sha validation reached)"
          [ "$RC" -ne 0 ]
