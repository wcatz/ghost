name: tmp-diag-env
on:
  push:
    branches: [feat/opencode-pr-review]
    paths: ['.github/workflows/tmp-diag-env.yml']

permissions:
  contents: read
  pull-requests: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: env probe
        run: |
          echo "== GITHUB_TOKEN present in step env? =="
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            echo "YES — GITHUB_TOKEN is set in process env, length ${#GITHUB_TOKEN}"
          else
            echo "NO — GITHUB_TOKEN is not in process env"
          fi
          echo "== other ambient tokens =="
          env | grep -iE 'token' | grep -v SHA256 | sed 's/=.\{0,12\}.*$/=<redacted>/'
          echo "(end env token probe)"