name: gate

# Placeholder that satisfies the repository's required "gate" status check
# (branch
# gate is native conversation resolution: Reviewer findings land as inline
# review threads and GitHub blocks merge while any remain unresolved. The
# Sweeper workflow (sweeper.yml) resolves stale threads and signals
# REQUEST_CHANGES while live findings exist. This workflow must exist on
# main before the required check is enabled, or every PR hangs on
# "Expected — waiting for status".
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - run: echo "merge gate satisfied"
