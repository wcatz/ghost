name: gate

# Placeholder for the repository's configured "gate" status check (branch
# protection). Verified against the branch-protection API on 2026-09-14
# (with the CORRECT field, required_conversation_resolution — an earlier
# typo'd key "conversation_resolution" always read null and seeded a wrong
# claim): main currently requires build-and-test + lint as status checks,
# HAS required_conversation_resolution enabled, no required approving
# reviews, and zero rulesets. The bot review pipeline
# (.github/workflows/pr-agent.yml) posts exactly one informational review
# comment per run with no inline threads, so it produces no unresolved
# conversations and never blocks a merge — the thread-sweeping pr-loop.yml
# was safe to delete. This workflow satisfies the legacy "gate" check name
# so the check never hangs on "Expected — waiting for status".
on:
  pull_request:
    branches: [main]
  # probe-protection watches for drift between the DOCUMENTED policy and
  # the live one (in either direction): the bot pipeline and pr-loop.yml's
  # deletion both assume the exact config below. If protection ever
  # changes, this weekly run (and every PR) surfaces it instead of
  # silently relying on a stale claim.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - run: echo "merge gate satisfied"

  # schedule-only: this job exists to turn the branch-protection CLAIM
  # (README + the comment above) into a periodically CHECKED one, not to
  # police every PR. Reading /branches/{branch}/protection requires admin
  # read — the per-job GITHUB_TOKEN at contents: read CANNOT do it (403).
  # Without an admin-scoped credential, this job MUST fail by design: an
  # unverifiable claim is red, never greenwashed by the old warn-and-pass.
  probe-protection:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      administration: read
    steps:
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          JSON="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main/protection")" || \
            { echo "::error::probe-protection: cannot read branch protection (got: $?) — admin read required; if GITHUB_TOKEN lacks it, grant the Review Sweeper App 'Administration: Read' on wcatz/ghost"; exit 1; }
          if printf '%s' "$JSON" | jq -e '.errors? // empty' >/dev/null; then
            echo "::error::GitHub API returned errors: $(printf '%s' "$JSON" | jq -c '.errors')"
            exit 1
          fi
          if printf '%s' "$JSON" | jq -e \
            '.required_conversation_resolution.enabled == true \
             and (.required_pull_request_reviews.required_approving_review_count // 0) == 0 \
             and (.required_status_checks?.contexts | length) == 2 \
             and ([.required_status_checks.contexts[] | select(. == "build-and-test" or . == "lint")] | length) == 2' >/dev/null; then
            echo "probe-protection: main matches the documented config (build-and-test + lint, conversation resolution required, no approval gate)"
          else
            echo "::error::branch protection on main DRIFTED from the documented policy (or its shape changed): $(printf '%s' "$JSON" | jq -c '.') — the bot-review pipeline and the pr-loop.yml deletion assume it (see README). Update gate.yml + README together when you intentionally change protection."
            exit 1
          fi
