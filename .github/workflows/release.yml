name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    # GoReleaser builds archives and checksums and creates the draft release,
    # so it needs contents: write. It publishes no container image because
    # .goreleaser.yml has no dockers or image_templates; the docker job pushes
    # the image.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify server.json matches the tag
        # server.json is what an MCP registry reads, so a stale version there
        # publishes a stale artifact regardless of what the release actually
        # built. Gate the release on it rather than letting it drift silently
        # (it once read 0.15.0 while the release was 0.29.0).
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(jq -r '.version' server.json)
          IDENTIFIER=$(jq -r '.packages[0].identifier' server.json)
          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "::error::server.json version ($FILE_VERSION) does not match tag ($VERSION) — bump server.json in the release commit before tagging."
            exit 1
          fi
          if [ "$IDENTIFIER" != "ghcr.io/wcatz/ghost:${VERSION}" ]; then
            echo "::error::server.json identifier ($IDENTIFIER) does not match ghcr.io/wcatz/ghost:${VERSION}"
            exit 1
          fi
          echo "server.json matches release ${VERSION}"

      - name: Run GoReleaser
        # release.draft (goreleaser.yml) makes this create a DRAFT release:
        # assets upload to the draft, releases/latest keeps serving the
        # previous release, and the plugin job publishes only after its three
        # archives attach and verify.
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    # contents: read covers actions/checkout; packages: write is what lets
    # GITHUB_TOKEN authenticate to ghcr.io in the login step and publish the
    # multi-arch image in the build step.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/wcatz/ghost:${{ steps.version.outputs.version }}
            ghcr.io/wcatz/ghost:latest

  # The Claude Code plugin ships as three archives. The macOS/Linux archive
  # bundles all four POSIX binaries behind one launcher. Native Windows gets
  # one single-arch archive per architecture, because Claude Code serves every
  # host from one .mcp.json/hooks.json command and a native .exe cannot serve
  # both windows-amd64 and windows-arm64. All are published as release assets
  # and the marketplace catalog is repinned below to each release's
  # version-pinned releases/download/vX.Y.Z URL + sha256 by
  # scripts/update-marketplace-digest.sh.
  # Runs after `release` because it attaches to the draft release GoReleaser
  # creates, then publishes it.
  #
  # Failure ordering — every stage is safe to re-run:
  #   before publish:      release is an unpublished draft; releases/latest
  #                        still serves the previous release. Re-run safe.
  #                        Deterministic pre-publish failure: a prerelease
  #                        tag (e.g. v0.31.0-rc1) passes the v* trigger but
  #                        is rejected by the digest script's bare-semver
  #                        gate → the draft can never be pinned; recovery is
  #                        delete the draft, fix/retag.
  #   after publish,
  #   before catalog push: main's catalog still points at valid assets
  #                        (version-pinned from the second release onward;
  #                        on the first, releases/latest — which keeps
  #                        serving the previous release until we publish).
  #                        Re-run safe.
  #   catalog commit step: MEASURED BLOCKED at v0.30.18 (run 35928382388):
  #                        GH013 ruleset violations reject BOTH write routes
  #                        for GITHUB_TOKEN — contents-API PUT (HTTP 409)
  #                        and git push (probe run 35929704681, same rules)
  #                        — so the job ends red at that step until an
  #                        authorization route is chosen. Users are
  #                        unaffected: main's catalog stays stale-but-valid.
  #                        Recovery = the manual admin runbook in the commit
  #                        step's comment below.
  #   after catalog push:  main's catalog pins this release's exact bytes;
  #                        the digest script is byte-idempotent and the
  #                        commit step skips when main already matches, so a
  #                        re-run creates no duplicate commit. Cross-release:
  #                        an older release's re-run stops at the downgrade
  #                        guard in the commit step — main is never rolled
  #                        back to an older catalog.
  plugin:
    needs: release
    runs-on: ubuntu-latest
    # contents: write uploads the three plugin archives as release assets and
    # writes the pinned catalog. pull-requests: write opens the catalog PR. No
    # packages: write — this job attaches archives to an existing release, it
    # does not publish an image.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Assemble the plugin trees
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/assemble-plugin.sh "$VERSION" dist/ghost-plugin
          # Contents at the archive root, so Claude Code finds
          # .claude-plugin/plugin.json without a wrapper directory.
          # Deterministic archives so a workflow re-run reproduces
          # byte-identical zips → stable digests → the re-run-safety
          # claims below hold: normalize mtimes to the DOS epoch
          # 1980-01-01 (zip's minimum timestamp), then zip a sorted entry
          # list with -X so no per-file extra fields (UT/UID/GID) leak in.
          find dist/ghost-plugin -exec touch -t 198001010000 {} +
          rm -f dist/ghost-plugin.zip
          (cd dist/ghost-plugin && find . -print | LC_ALL=C sort | zip -X -q ../ghost-plugin.zip -@)
          unzip -l dist/ghost-plugin.zip | head -20
          for arch in amd64 arm64; do
            scripts/assemble-plugin-windows.sh "$arch" "$VERSION" "dist/ghost-plugin-windows-$arch"
            find "dist/ghost-plugin-windows-$arch" -exec touch -t 198001010000 {} +
            rm -f "dist/ghost-plugin-windows-$arch.zip"
            (cd "dist/ghost-plugin-windows-$arch" && find . -print | LC_ALL=C sort | zip -X -q "../ghost-plugin-windows-$arch.zip" -@)
            unzip -l "dist/ghost-plugin-windows-$arch.zip" | head -20
          done

      - name: Attach the plugin archives to the release
        # --clobber is kept deliberately: once the catalog pins a digest
        # below, a post-pin swap of these assets is detectable as an
        # install-time sha256 failure instead of landing silently.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/ghost-plugin.zip \
            dist/ghost-plugin-windows-amd64.zip \
            dist/ghost-plugin-windows-arm64.zip \
            --clobber

      - name: Pin the marketplace catalog to the attached archives
        # Rewrites .claude-plugin/marketplace.json (this tag checkout) to
        # version-pinned releases/download/vX.Y.Z URLs plus each archive's
        # sha256. The zips are the ones zipped into dist/ above.
        run: scripts/update-marketplace-digest.sh "${GITHUB_REF_NAME#v}" dist

      - name: Publish the release
        # First irreversible point. Before it, a failure leaves an
        # unpublished draft and releases/latest keeps serving the previous
        # release, so the job can simply be re-run.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false

      - name: Verify published archive URLs return 200
        # A release published with a missing or broken asset must fail loudly
        # here — this is the detector for the /plugin install 404 window:
        # all six URLs (three version-pinned + three releases/latest) must
        # return 200 after redirects.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          fail=0
          for zip in ghost-plugin.zip ghost-plugin-windows-amd64.zip ghost-plugin-windows-arm64.zip; do
            for url in \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${zip}" \
              "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${zip}"; do
              code="$(curl -sSL --retry 3 --retry-connrefused -o /dev/null -w '%{http_code}' "$url" || true)"
              if [ "$code" = "200" ]; then
                echo "200 $url"
              else
                echo "::error::expected 200 for ${url}, got ${code:-no response}"
                fail=1
              fi
            done
          done
          [ "$fail" -eq 0 ]

      - name: Propose the pinned catalog as a pull request
        id: pin
        # The catalog is pinned to version-pinned release URLs plus each
        # archive's sha256. It must reach main, and main requires a pull
        # request plus three status checks (measured at v0.30.18, run
        # 35928382388: the contents-API PUT with GITHUB_TOKEN returned HTTP 409
        # GH013, and the git-push route under the same context, run
        # 35929704681, was rejected with the same violations).
        #
        # A workflow's GITHUB_TOKEN cannot be a bypass actor on a personal
        # repository, so this writes the catalog to a unique unprotected branch
        # and opens a PR instead. That is GitHub's documented behaviour for
        # automation-created PRs: the pull_request event DOES create workflow
        # runs, held in an approval-required state, released from the merge box
        # with "Approve workflows to run". A GitHub App or PAT token would skip
        # that click, but a human was always going to merge the PR, so it is not
        # worth a long-lived credential.
        #
        # The branch is unique per release and is deleted at merge by the
        # repository's "Automatically delete head branches" setting, so there
        # is no delete logic here to fail.
        #
        # MANUAL STEP after this job succeeds: open the PR below, click
        # "Approve workflows to run", then merge it. Until the pin is merged,
        # the catalog keeps pointing at the previous release — which is safe,
        # because those URLs remain valid.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PATH_IN_REPO=".claude-plugin/marketplace.json"
          VERSION="${GITHUB_REF_NAME#v}"
          BRANCH="automation/marketplace-pin-v${VERSION}"
          gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_IN_REPO}?ref=main" > /tmp/main-contents.json
          # Split into two simple commands, not a pipe (and not `&&`): under
          # Actions' default `bash -e {0}` (no pipefail) a jq failure piped
          # into base64 is masked by base64's success, and a failing left
          # side of `&&` does not trigger errexit either. As separate lines
          # each command is errexit-visible; -e makes jq fail on null/empty.
          jq -er '.content' /tmp/main-contents.json > /tmp/main-marketplace.b64
          base64 -d /tmp/main-marketplace.b64 > /tmp/main-marketplace.json
          if cmp -s /tmp/main-marketplace.json "$PATH_IN_REPO"; then
            echo "main already pins ${GITHUB_REF_NAME}; skipping catalog pin"
            echo "SKIPPED=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Cross-release guard (carried over unchanged): a re-run of an OLD
          # release after a newer release already repinned main must never
          # downgrade the catalog. Extract the version main pins now via jq —
          # scoped to source.url so no description/homepage text can poison it
          # (empty while main still carries releases/latest URLs) — and skip
          # when it is newer than this tag. Same version with different bytes
          # falls through: that is a legitimate re-pin (e.g. --clobber
          # replaced the assets, so the catalog must follow the new digests).
          MAIN_VERSION="$(jq -r '[.plugins[]?.source.url? | strings | select(test("releases/download/v[0-9]+\\.[0-9]+\\.[0-9]+/")) | capture("releases/download/v(?<v>[0-9]+\\.[0-9]+\\.[0-9]+)/").v] | .[0] // empty' /tmp/main-marketplace.json)"
          NEWEST="$(printf '%s\n%s\n' "$MAIN_VERSION" "$VERSION" | sort -V | tail -n 1)"
          if [ -n "$MAIN_VERSION" ] && [ "$MAIN_VERSION" != "$VERSION" ] && [ "$NEWEST" = "$MAIN_VERSION" ]; then
            echo "main pins newer release v${MAIN_VERSION}; not downgrading to v${VERSION} — skipping catalog pin"
            echo "SKIPPED=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Resolve the blob SHA the PUT must carry. The contents API takes "the
          # blob SHA of the file being replaced" ON THE TARGET BRANCH, so main's
          # SHA is only right when the branch does not exist yet.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            # Re-run of a tag whose branch already carries a catalog commit but
            # whose PR was never merged. main still holds the older catalog, so
            # main's SHA would be stale and the PUT would 409.
            gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_IN_REPO}?ref=${BRANCH}" > /tmp/branch-contents.json
            BLOB_SHA="$(jq -r '.sha' /tmp/branch-contents.json)"
            echo "pin branch ${BRANCH} already exists; updating it"
          else
            # First run. The contents API's branch parameter is not documented to
            # create a missing ref, so create it explicitly rather than depend on
            # undocumented auto-creation. A branch cut from main's HEAD carries
            # main's marketplace.json blob, so main's SHA is the correct one.
            MAIN_HEAD_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${BRANCH}" -f sha="$MAIN_HEAD_SHA" >/dev/null
            BLOB_SHA="$(jq -r '.sha' /tmp/main-contents.json)"
            echo "created pin branch ${BRANCH} from main@${MAIN_HEAD_SHA:0:7}"
          fi
          CONTENT_B64="$(base64 <"$PATH_IN_REPO" | tr -d '\n')"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${PATH_IN_REPO}" \
            -f message="chore(release): pin plugin archives for ${GITHUB_REF_NAME}"$'\n\n'"Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" \
            -f content="$CONTENT_B64" \
            -f sha="$BLOB_SHA" \
            -f branch="$BRANCH" >/dev/null
          echo "wrote pinned catalog to ${BRANCH}"
          echo "BRANCH=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "SKIPPED=0" >> "$GITHUB_OUTPUT"

      - name: Open or update the catalog pull request
        # GITHUB_TOKEN-created PRs do produce workflow runs, but held pending
        # approval (see the step above), so the merge box shows a banner. The
        # summary below says so explicitly: without it a successful release
        # looks stalled, because the PR is open and its checks are queued with
        # nothing explaining why.
        if: steps.pin.outputs.SKIPPED == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BRANCH="${{ steps.pin.outputs.BRANCH }}"
          {
            echo "Pins \`.claude-plugin/marketplace.json\` to the"
            echo "\`releases/download/${GITHUB_REF_NAME}\` archives attached by this release,"
            echo "with each archive's sha256."
            echo
            jq -r '.plugins[] | "- `\(.name)`: \(.source.url) (`\(.source.sha256)`)"' \
              .claude-plugin/marketplace.json
            echo
            echo "Written by the release workflow for ${GITHUB_REF_NAME}."
          } > /tmp/pr-body.md
          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --body-file /tmp/pr-body.md
            echo "updated existing catalog PR #${EXISTING}"
            PR_URL="$(gh pr view "$EXISTING" --json url --jq .url)"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(release): pin plugin archives for ${GITHUB_REF_NAME}" \
              --body-file /tmp/pr-body.md
            PR_URL="$(gh pr view "$BRANCH" --json url --jq .url)"
          fi
          # Assign first, then write. A command substitution that fails inside a
          # double-quoted echo argument does not fail the echo, so the previous
          # form wrote an empty PR_URL and the summary silently lost the link
          # the manual merge needs. As its own statement the assignment is
          # errexit-visible.
          if [ -z "$PR_URL" ]; then
            echo "::error::could not resolve the catalog PR URL"
            exit 1
          fi
          printf 'PR_URL=%s\n' "$PR_URL" >> "$GITHUB_OUTPUT"
        id: open-pr

      - name: Report the manual merge step
        if: steps.pin.outputs.SKIPPED == '0'
        run: |
          {
            echo "### Catalog pin needs a manual merge"
            echo
            echo "1. Open ${{ steps.open-pr.outputs.PR_URL }}"
            echo "2. Click **Approve workflows to run** in the merge box — the checks"
            echo "   are held pending because the PR was created by the workflow"
            echo "3. Merge once the three required checks pass"
            echo
            echo "Until then the catalog keeps pointing at the previous release."
            echo "Those URLs stay valid, so installs are not broken."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the catalog on the pin branch matches the pinned copy
        if: steps.pin.outputs.SKIPPED == '0'
        # Reads the pin branch, not main: at this point in the job the PR is open
        # but not merged, so main still carries the previous release and a
        # comparison against it could only fail. Route: contents API, not
        # raw.githubusercontent.com — the raw branch CDN caches for minutes, so
        # immediately after a successful write it can still serve pre-write
        # bytes and spuriously fail a write that already landed. The API is
        # read-your-writes consistent.
        #
        # Skipped when a guard caused the pin step to exit early, because then no
        # branch write happened and there is nothing new to verify; running it
        # anyway would compare a stale branch against the local copy and fail a
        # correctly-skipped release. The main catalog is verified by the PR's own
        # required checks, which the branch rule will not let a merge bypass.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PATH_IN_REPO=".claude-plugin/marketplace.json"
          BRANCH="${{ steps.pin.outputs.BRANCH }}"
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if gh api "repos/${GITHUB_REPOSITORY}/contents/${PATH_IN_REPO}?ref=${BRANCH}" > /tmp/verify-contents.json; then
              # Two simple commands, not a pipe (nor `&&`): `bash -e {0}` has
              # no pipefail, so a jq failure piped into base64 would be
              # masked — and `&&` doesn't trip errexit on its left side.
              jq -er '.content' /tmp/verify-contents.json > /tmp/verify-marketplace.b64
              base64 -d /tmp/verify-marketplace.b64 > /tmp/verify-marketplace.json
              if cmp -s /tmp/verify-marketplace.json "$PATH_IN_REPO"; then
                echo "pin branch ${BRANCH} verified against the pinned copy"
                exit 0
              fi
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "attempt ${attempt}: ${BRANCH} not in sync; retrying in 10s"
              sleep 10
            fi
            attempt=$((attempt + 1))
          done
          if [ ! -f /tmp/verify-marketplace.json ]; then
            echo "::error::could not fetch marketplace.json from ${BRANCH} via the contents API"
            exit 1
          fi
          echo "::error::${BRANCH} differs from the pinned local copy"
          diff -u .claude-plugin/marketplace.json /tmp/verify-marketplace.json || true
          exit 1
