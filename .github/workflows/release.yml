name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify server.json matches the tag
        # server.json is what an MCP registry reads, so a stale version there
        # publishes a stale artifact regardless of what the release actually
        # built. Gate the release on it rather than letting it drift silently
        # (it once read 0.15.0 while the release was 0.29.0).
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(jq -r '.version' server.json)
          IDENTIFIER=$(jq -r '.packages[0].identifier' server.json)
          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "::error::server.json version ($FILE_VERSION) does not match tag ($VERSION) — bump server.json in the release commit before tagging."
            exit 1
          fi
          if [ "$IDENTIFIER" != "ghcr.io/wcatz/ghost:${VERSION}" ]; then
            echo "::error::server.json identifier ($IDENTIFIER) does not match ghcr.io/wcatz/ghost:${VERSION}"
            exit 1
          fi
          echo "server.json matches release ${VERSION}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/wcatz/ghost:${{ steps.version.outputs.version }}
            ghcr.io/wcatz/ghost:latest
