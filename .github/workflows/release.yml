name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/wcatz/ghost:${{ steps.version.outputs.version }}
            ghcr.io/wcatz/ghost:latest

  # The Claude Code plugin is one archive covering all six platform binaries,
  # published as a release asset so the marketplace entry (which points at
  # releases/latest/download/ghost-plugin.zip) never needs a per-release edit.
  # Runs after `release` because it attaches to the release GoReleaser creates.
  plugin:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Assemble the plugin tree
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/assemble-plugin.sh "$VERSION" dist/ghost-plugin
          # Contents at the archive root, so Claude Code finds
          # .claude-plugin/plugin.json without a wrapper directory.
          (cd dist/ghost-plugin && zip -qr ../ghost-plugin.zip .)
          unzip -l dist/ghost-plugin.zip | head -20

      - name: Attach the plugin archive to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/ghost-plugin.zip --clobber
