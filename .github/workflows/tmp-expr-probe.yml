name: expr probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Prove && and || preserve operand values (GH expression semantics)
        run: |
          echo "and_sentinel: ${{ true && 'manual' }}"
          echo "or_sentinel:  ${{ 0 || 42 }}"
          echo "chain_pr:     ${{ ((github.event_name == 'issue_comment') && 'manual') || ((github.event_name == 'pull_request') && 'auto') || 'noop' }}"
          echo "chain_cmd:    ${{ ((github.event_name == 'issue_comment') && github.event.sender.type != 'Bot' && contains('OWNER MEMBER COLLABORATOR', 'OWNER') && (github.event.comment.body == '/review' || startsWith(github.event.comment.body, '/review ') || startsWith(github.event.comment.body, '/review –')) && 'manual') || ((github.event_name == 'pull_request') && 'auto') || 'noop' }}"