# PR-Agent repository settings.
# Fetched automatically from this default branch by the pr-agent.yml
# workflow (apply_repo_settings). Runtime plumbing — API key, endpoint,
# model routing — stays in the workflow's env; anything set in both
# places keeps the workflow value.

[config]
# Feed project context so the model reviews with full knowledge.
repo_context_files = ["CLAUDE.md", "best_practices.md"]
repo_context_from_default_branch = true
repo_context_max_lines = 500
# Don't re-post the same suggestion on every push — fingerprint
# markers deduplicate across runs.
persistent_inline_comments = true
# Fail the job loudly when a tool errors out. Observed 2026-08-25: an
# /improve hung on the Zen endpoint, ai_timeout killed the LLM calls,
# and the action exited GREEN with zero output — log jumped straight
# from "Number of PR chunk calls" to completion.
propagate_tool_errors = true

[best_practices]
# Auto-detect from best_practices.md at repo root.
enable_global_best_practices = true

[pr_reviewer]
# Anchor key issues as inline comments on diff lines instead of
# listing them only in the summary table (matches the old CodeRabbit
# comment style more closely).
inline_key_issues = true

# Upstream caps findings at 3; raise for better coverage on
# refactors. Reviewer extra_instructions keep style noise out.
num_max_findings = 5

# Richer review sections (CodeRabbit parity).
require_score_review = true
require_todo_scan = true
require_can_be_split_review = true

# Compliance checks alone miss invariant-class bugs. Observed 2026-08-26
# (#394): a PR exposed Store.MergeProject via a new CLI command and scored
# 92/fully-compliant while missing that DeleteProject refuses _global but
# MergeProject did not. The format contract produces a verdict-first card
# (brainstorm 2026-08-26); the lenses direct attention at exactly that class.
extra_instructions = """
Output format (mandatory): open with a verdict card exactly in this shape:
'## <emoji> Verdict: <approve|approve with nits|comment|request changes> — <one-line why>',
then '**Findings:** N 🔴 · N 🟡 · N 🟢 | Effort: 🔵🔵⚪⚪⚪',
then a six-row markdown lens table (Tests, Security, Error handling,
Invariant parity, Protected resources, Behavior preservation) whose Result
column is '✅' or '⚠️ N', then a '### Findings' list ordered 🔴→🟡→🟢 where
each finding is '<severity> **file:line** — what is wrong → why it matters →
concrete fix'. Severity: 🔴 blocker (correctness/race/data-loss),
🟡 should-fix, 🟢 nit. Put ticket compliance analysis, effort breakdown,
and focus areas inside a '<details><summary>Ticket compliance · full
analysis</summary>' block after Findings. The card must be readable in
under 15 seconds.

Beyond diff-vs-issue compliance, apply these lenses and report findings per lens:
1. Invariant parity: when a PR adds a caller of an existing internal API (new CLI command, MCP tool, or store method), read that API's full implementation chain down to the deepest layer it touches, and compare its guard clauses against sibling mutators on the same resource (e.g. DeleteProject refuses _global — any new destructive or reassigning operation on projects must refuse it too).
2. Protected resources: the _global project row, production DB rows, subprocess env keys. Verify refusal paths exist at the deepest implementation layer, not only at the wrapper the PR introduced.
3. Behavior preservation at modified call sites: confirm replacement error-handling logic covers the same failure modes as before (e.g. an `err != nil` check replaced by an empty-string check must be equivalent for every path that previously returned err).
"""

[pr_code_suggestions]
# Post high-confidence suggestions as committable inline code comments
# (GitHub suggestion blocks the author can accept with one click).
commitable_code_suggestions = true
# Medium-confidence (7+) suggestions get both table + inline comment.
dual_publishing_score_threshold = 7
# Filter low-confidence suggestions — biggest noise reducer.
suggestions_score_threshold = 3
# Budget: top-N suggestions per run keeps auto-improve inside the 25m
# runner cap (each suggestion is a sequential LLM call).
num_code_suggestions = 4
